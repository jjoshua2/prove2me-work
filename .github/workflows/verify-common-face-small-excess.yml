name: Verify target-cone used cut reinsertion

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: verify-target-cone-used-cuts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.head_ref == 'formal/target-cone-used-cuts-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit target-cone used-cut theorem
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialTargetConeUsedCuts 2>&1 | tee /tmp/target-cone-used-cuts.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/target-cone-used-cuts.log').read_text()
          name='HirschTargetDeletion.target_slack_batch_reinsertion_with_parent_routes_used_cuts'
          allowed={'propext','Classical.choice','Quot.sound'}
          pat=re.compile(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",re.S)
          reports={n:{x.strip() for x in raw.split(',') if x.strip()} for n,raw in pat.findall(text)}
          for n in re.findall(r"'([^']+)' does not depend on any axioms",text): reports[n]=set()
          if name not in reports: raise SystemExit('missing axiom report for '+name)
          bad=reports[name]-allowed
          if bad: raise SystemExit(f'unexpected axioms for {name}: {sorted(bad)}')
          print(name, sorted(reports[name]))
          print('PASS: target-cone used-cut theorem audited')
          PY
