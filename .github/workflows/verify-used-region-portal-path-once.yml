name: Verify used-region portal path
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
permissions:
  contents: read
concurrency:
  group: verify-used-region-portal-path-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/used-region-portal-path' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit portal-path routing
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialUsedRegionPortalPath
          lake env lean Solutions/PolynomialUsedRegionPortalPath.lean 2>&1 | tee /tmp/used-region-portal-path.log
          python3 scripts/check_lean_axiom_log.py /tmp/used-region-portal-path.log \
            HirschRegionRoute.route_of_connected_regions_with_used_path \
            HirschRegionRoute.route_of_preconnected_face_cover_with_parent_routes_used_path \
            HirschRegionRoute.parent_vertex_portal_of_used_path_edge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: used-region-portal-path-verification
          retention-days: 14
          path: /tmp/used-region-portal-path.log
          if-no-files-found: warn
