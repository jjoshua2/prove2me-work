name: Verify target-face diameter bridge
on:
  push:
    branches: [chatgpt/target-face-diameter-bridge]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-target-face-diameter-bridge
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pinned environment
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit target-face diameter bridge
        run: |
          set -euo pipefail
          lake build Theorems.Thm_Hirsch_diameter_bound_of_target_face_access 2>&1 | tee /tmp/target-face-diameter.log
          python3 scripts/check_lean_axiom_log.py /tmp/target-face-diameter.log \
            HirschPolynomialAccess.common_face_walk_of_diamLE \
            HirschPolynomialAccess.commonFaceDim_lt_of_shared_nonzero_row \
            Hirsch.diameter_bound_of_target_face_access_verified \
            Hirsch.diameter_bound_of_target_face_access
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-face-diameter-bridge-audit
          retention-days: 3
          path: /tmp/target-face-diameter.log
