name: Verify target-anchored batch deletion once
on:
  pull_request:
    types: [ready_for_review]
permissions:
  contents: read
concurrency:
  group: target-anchored-deletion-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/target-anchored-batch-deletion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check frozen source and exact regression
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
          echo '1b8e3c801aa4a549728880ce253381aab0317ded1a1ee95c0635c9dea4d62a7e  Solutions/PolynomialTargetAnchoredDeletion.lean' | sha256sum -c -
          python3 scripts/test_target_anchored_deletion.py > /tmp/target-deletion-exact.json
          echo '094ebcb1551b051d86d0e29e773e2530934a3766a4e9a9bf1087b802ecad7097  /tmp/target-deletion-exact.json' | sha256sum -c -
      - name: Restore shared pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile exact target and audit seven declarations
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialTargetAnchoredDeletion 2>&1 | tee /tmp/target-deletion-build.log
          lake env lean Solutions/PolynomialTargetAnchoredDeletion.lean 2>&1 | tee /tmp/target-deletion-axioms.log
          python3 scripts/check_lean_axiom_log.py /tmp/target-deletion-axioms.log \
            HirschTargetDeletion.selected_rowMap_injective_of_covers_target_tight \
            HirschTargetDeletion.selected_vertex_of_covers_target_tight \
            HirschTargetDeletion.exists_target_preserving_batch_deletion \
            HirschTargetDeletion.selected_tight_outer_extremePoints_eq_singleton \
            HirschTargetDeletion.selected_tight_outer_diamLE_zero \
            HirschTargetDeletion.exists_zero_diameter_target_outer \
            HirschTargetDeletion.same_phase_step_has_target_preserving_blocker_deletion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-anchored-deletion-verification
          retention-days: 14
          path: |
            /tmp/target-deletion-exact.json
            /tmp/target-deletion-build.log
            /tmp/target-deletion-axioms.log
          if-no-files-found: error
