name: Polynomial access Lean check

on:
  push:
    branches: [chatgpt/polynomial-access]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
          key: polynomial-access-lean430-c5ea003-v1
      - name: Install elan if needed
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        run: ~/.elan/bin/lake exe cache get
      - name: Build imported theorem stubs
        run: ~/.elan/bin/lake build Definitions.Def_Hirsch_model Theorems.Thm_Hirsch_larman_bound Theorems.Thm_Hirsch_dimension_three_bound Theorems.Thm_Hirsch_vertex_tight_rows_span Theorems.Thm_Hirsch_nonzero_supporting_row_of_distinct_extremes
      - name: Build face-access baseline module
        continue-on-error: true
        run: |
          ~/.elan/bin/lake env lean Solutions/PolynomialFaceAccessBench.lean
          ~/.elan/bin/lake build Solutions.PolynomialFaceAccessBench
      - name: Build separated-row reduction
        continue-on-error: true
        run: |
          ~/.elan/bin/lake env lean Solutions/PolynomialSeparatedRows.lean
          ~/.elan/bin/lake build Solutions.PolynomialSeparatedRows
      - name: Build Larman easy-regime reduction
        continue-on-error: true
        run: |
          ~/.elan/bin/lake env lean Solutions/PolynomialAccessPadding.lean
          ~/.elan/bin/lake build Solutions.PolynomialAccessPadding
      - name: Compile specified hard-regime reduction
        continue-on-error: true
        run: ~/.elan/bin/lake env lean Solutions/PolynomialHardRegimeReduction.lean
      - name: Build balanced one-edge target access
        continue-on-error: true
        run: |
          ~/.elan/bin/lake env lean Solutions/PolynomialBalancedOneStep.lean
          ~/.elan/bin/lake build Solutions.PolynomialBalancedOneStep
      - name: Compile general first-edge dichotomy
        continue-on-error: true
        run: ~/.elan/bin/lake env lean Solutions/PolynomialFirstEdge.lean
      - name: Compile strict existential target-access reduction
        continue-on-error: true
        run: ~/.elan/bin/lake env lean Solutions/PolynomialTargetHardRegimeReduction.lean
      - name: Compile separated midpoint interior geometry
        continue-on-error: true
        run: ~/.elan/bin/lake env lean Solutions/PolynomialSeparatedInterior.lean
      - name: Build excess common-face rank bound
        continue-on-error: true
        run: |
          ~/.elan/bin/lake env lean Solutions/PolynomialExcessFaceRank.lean
          ~/.elan/bin/lake build Solutions.PolynomialExcessFaceRank
      - name: Compile common source face geometry
        continue-on-error: true
        run: ~/.elan/bin/lake env lean Solutions/PolynomialCommonFace.lean
