name: Polynomial access Lean check

on:
  push:
    branches: [chatgpt/polynomial-access]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: lean-cache
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
          key: polynomial-access-lean430-c5ea003-v1
      - name: Install elan if needed
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache if needed
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: ~/.elan/bin/lake exe cache get
      - name: Build excess-parameter target access and dependencies
        id: lean-build
        continue-on-error: true
        run: ~/.elan/bin/lake build Solutions.PolynomialExcessTargetAccess
      - name: Save Lean cache
        if: always() && steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
          key: polynomial-access-lean430-c5ea003-v1
      - name: Propagate Lean build result
        if: always()
        run: |
          if [ "${{ steps.lean-build.outcome }}" != "success" ]; then
            exit 1
          fi
