name: Polynomial access Lean check

on:
  push:
    branches: [chatgpt/polynomial-access]

concurrency:
  group: polynomial-access-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public Prove2Me frontier
        run: |
          python3 - <<'PY'
          import datetime, urllib.request
          from html.parser import HTMLParser
          print('FETCHED_AT', datetime.datetime.now(datetime.timezone.utc).isoformat())
          url='https://prove2.me/missions/The%20Polynomial%20Hirsch%20Conjecture'
          class Text(HTMLParser):
            def __init__(self):
              super().__init__(); self.parts=[]; self.skip=0
            def handle_starttag(self, tag, attrs):
              if tag in ('script','style'): self.skip += 1
            def handle_endtag(self, tag):
              if tag in ('script','style'): self.skip = max(0,self.skip-1)
            def handle_data(self, value):
              if not self.skip and value.strip(): self.parts.append(value.strip())
          with urllib.request.urlopen(url, timeout=30) as response:
            p=Text(); p.feed(response.read().decode('utf-8'))
          text='\n'.join(p.parts)
          start=text.find('Frontier')
          if start < 0: raise RuntimeError('Frontier not found on live mission page')
          print(text[start:start+1500])
          PY
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install elan if needed
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        run: ~/.elan/bin/lake exe cache get
      - name: Build geometric theorem without admitted imports
        run: |
          set -o pipefail
          mkdir -p submission_packet
          ~/.elan/bin/lake build Solutions.PolynomialLowDimFaceSubmission 2>&1 | tee submission_packet/geometry-build.log
      - name: Bundle and independently audit exact submission files
        run: |
          python3 scripts/bundle_polynomial_face.py
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess
          out=pathlib.Path('submission_packet')
          allowed={'propext','Classical.choice','Quot.sound'}
          report={}
          for name in ['solution.lean','standalone.lean']:
            p=out/name
            run=subprocess.run([str(pathlib.Path.home()/'.elan/bin/lake'),'env','lean',str(p)], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
            (out/(name+'.audit.log')).write_text(run.stdout)
            print(run.stdout)
            if run.returncode: raise SystemExit(run.returncode)
            found=re.search(r"'solution' depends on axioms:\s*\[([^]]*)\]", run.stdout)
            if not found: raise RuntimeError('Missing solution axiom report for '+name)
            axioms={x.strip() for x in found.group(1).split(',') if x.strip()}
            if not axioms <= allowed: raise RuntimeError('Unexpected axioms: '+repr(axioms-allowed))
            report[name]={'compiled':True,'axioms':sorted(axioms),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'verification.json').write_text(json.dumps(report,indent=2)+'\n')
          print('GEOMETRIC_PACKET_VERIFIED',json.dumps(report))
          PY
      - name: Build double-hard target-access reduction and dependencies
        run: |
          set -o pipefail
          ~/.elan/bin/lake build Solutions.PolynomialTargetDoubleHardReduction 2>&1 | tee submission_packet/target-access-build.log
      - name: Upload proof packet and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polynomial-face-proof-packet
          path: submission_packet/
          if-no-files-found: warn
