name: Single-cut cube diameter
on:
  workflow_dispatch:
concurrency:
  group: single-cut-cube-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read current platform state
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: |
          mkdir -p cube_packet
          python3 - <<'PY'
          import datetime,json,os,urllib.request
          from html.parser import HTMLParser
          class Text(HTMLParser):
              def __init__(self): super().__init__(); self.parts=[]; self.skip=0
              def handle_starttag(self,t,a):
                  if t in ('script','style'): self.skip+=1
              def handle_endtag(self,t):
                  if t in ('script','style'): self.skip=max(0,self.skip-1)
              def handle_data(self,t):
                  if not self.skip and t.strip(): self.parts.append(t.strip())
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise RuntimeError('Authenticated redirects are disabled')
          report={'fetched_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          for name,url in [('user','https://prove2.me/users/c7399005-c54f-46c6-83fd-0131738d1e3f'),('mission','https://prove2.me/missions/The%20Polynomial%20Hirsch%20Conjecture')]:
              try:
                  with urllib.request.urlopen(url,timeout=30) as r: raw=r.read().decode()
                  p=Text();p.feed(raw);text='\n'.join(p.parts)
                  open('cube_packet/'+name+'.txt','w').write(text)
                  report[name]={'status':200,'url':url}
                  if name=='mission':
                      start=text.find('Frontier');print(text[start:start+1000])
              except Exception as e: report[name]={'error':type(e).__name__}
          key=os.environ.get('PROVE2ME_API_KEY','').strip()
          report['repository_secret_present']=bool(key)
          if key:
              base='https://prove2.me/api/v1'
              opener=urllib.request.build_opener(NoRedirect)
              req=urllib.request.Request(base+'/agent/refresh',data=json.dumps({'api_key':key}).encode(),headers={'Content-Type':'application/json'},method='POST')
              with opener.open(req,timeout=30) as r: auth=json.load(r)
              token=auth['access_token']
              req=urllib.request.Request(base+'/theorems/33fc334e-e05b-4090-ac49-f83fd94d9305',headers={'Authorization':'Bearer '+token})
              with opener.open(req,timeout=30) as r: theorem=json.load(r)
              report['leaf']={k:theorem.get(k) for k in ('theorem_id','theorem_name','status','mathlib_rev')}
              print('AUTHENTICATED_FRONTIER',json.dumps(report['leaf']))
          else: print('Repository secret PROVE2ME_API_KEY is not configured; no authenticated request was sent.')
          open('cube_packet/live-state.json','w').write(json.dumps(report,indent=2))
          PY
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Build concrete cube-cut geometry
        run: |
          set -o pipefail
          lake build Solutions.SingleCutCubeSubmission 2>&1 | tee cube_packet/build.log
      - name: Independently compile exact submission files and audit axioms
        run: python3 scripts/bundle_single_cut_cube.py
      - name: Authenticated related-theorem search when configured
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: |
          if [ -n "$PROVE2ME_API_KEY" ]; then
            python3 scripts/submit_checked_packet.py --workspace . --packet cube_packet
          else
            echo 'No repository secret configured; skipping authenticated duplicate search and publication.'
          fi
      - name: Upload proof diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: single-cut-cube-proof-packet
          path: cube_packet/
          if-no-files-found: warn
          retention-days: 3
