name: Verify simultaneous clipping without publication
on:
  push:
    branches: [chatgpt/verify-simultaneous-clipping]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-simultaneous-clipping
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pinned environment
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          python3 - <<'PY'
          import json
          packages=json.load(open('lake-manifest.json'))['packages']
          assert next(p['rev'] for p in packages if p['name']=='mathlib') == 'c5ea00351c28e24afc9f0f84379aa41082b1188f'
          PY
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile source chain and public adapter
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialHorizonCap Solutions.Sol_Hirsch_simultaneous_clipping_diameter_of_compact_outer 2>&1 | tee /tmp/all-clipping.log
          python3 - <<'PY'
          import pathlib,re,subprocess
          names=[]
          modules={'PolynomialClosedFaceTrace','PolynomialConvexSubsegment','PolynomialRadialRetraction','PolynomialClipEndpointLift','PolynomialSimultaneousClipDiameter','PolynomialHorizonCap'}
          for module in sorted(modules):
              text=pathlib.Path('Solutions',module+'.lean').read_text()
              ns=re.search(r'^namespace (\w+)',text,re.M).group(1)
              names += [ns+'.'+x for x in re.findall(r'^#print axioms (\w+)',text,re.M)]
          assert len(names)==42, (len(names),names)
          subprocess.run(['python3','scripts/check_lean_axiom_log.py','/tmp/all-clipping.log',*names,'solution'],check=True)
          PY
      - name: Build and independently compile standalone proof
        run: |
          set -euo pipefail
          python3 scripts/build_simultaneous_clipping_standalone.py /tmp/bounded-solution.lean /tmp/bounded-manifest.json
          lake env lean /tmp/bounded-solution.lean 2>&1 | tee /tmp/standalone.log
          python3 scripts/check_lean_axiom_log.py /tmp/standalone.log solution
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('/tmp/bounded-manifest.json').read_text())
          assert hashlib.sha256(Path('/tmp/bounded-solution.lean').read_bytes()).hexdigest()==m['solution_sha256']
          m['status']='SOURCE_ADAPTER_AND_STANDALONE_COMPILED_AND_AUDITED'
          m['source_commit']='${{ github.sha }}'
          m['actions_run_id']='${{ github.run_id }}'
          Path('/tmp/bounded-manifest.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
      - name: Reproduce complete exact carrier regressions
        run: |
          set -euo pipefail
          python3 scripts/test_cone_carrier_descent.py --output /tmp/cone-carrier.json
          python3 scripts/check_carrier_regression.py /tmp/cone-carrier.json
          python3 scripts/test_carrier_euler_refinement.py --output /tmp/carrier-euler.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          raw=Path('/tmp/carrier-euler.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='6ae805853a90ac7d08b1fc381c9713fab12adcb058512379d5f85439c00a4f6e'
          data=json.loads(raw)
          assert (data['instances'],data['pairs'],data['three_dimensional_relaxations'])==(40,8813,37)
          assert data['all_explicit_routes_pass'] is True
          print('Euler-refined exact output reproduced byte-for-byte.')
          PY
      - name: Package audited sources and verification outputs
        run: python3 scripts/package_clipping_continuation.py /tmp/clipping-verified-source.zip
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: simultaneous-clipping-audit
          retention-days: 7
          path: |
            /tmp/all-clipping.log
            /tmp/standalone.log
            /tmp/bounded-solution.lean
            /tmp/bounded-manifest.json
            /tmp/cone-carrier.json
            /tmp/carrier-euler.json
            /tmp/clipping-verified-source.zip
