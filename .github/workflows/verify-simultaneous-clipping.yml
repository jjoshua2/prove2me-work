name: Verify simultaneous clipping without publication
on:
  push:
    branches: [chatgpt/verify-simultaneous-clipping]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-simultaneous-clipping
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: lean-cache
        with:
          path: |
            ~/.elan
            .lake
          key: clipping-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          if ! test -x ~/.elan/bin/lake; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y > /tmp/setup.log 2>&1
          fi
          ~/.elan/bin/lake exe cache get >> /tmp/setup.log 2>&1 || { tail -100 /tmp/setup.log; exit 1; }
      - uses: actions/cache/save@v4
        if: steps.lean-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.elan
            .lake
          key: clipping-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Compile full chain and audit
        run: |
          set -euo pipefail
          ~/.elan/bin/lake build Solutions.PolynomialHorizonCap 2>&1 | tee /tmp/all-clipping.log
          python3 - <<'PY'
          import pathlib,re,subprocess
          names=[]
          modules={'PolynomialClosedFaceTrace','PolynomialConvexSubsegment','PolynomialRadialRetraction','PolynomialClipEndpointLift','PolynomialSimultaneousClipDiameter','PolynomialHorizonCap'}
          for module in sorted(modules):
              text=pathlib.Path('Solutions',module+'.lean').read_text()
              ns=re.search(r'^namespace (\w+)',text,re.M).group(1)
              names += [ns+'.'+x for x in re.findall(r'^#print axioms (\w+)',text,re.M)]
          assert len(names)==42, (len(names),names)
          print('Required declarations:',len(names))
          subprocess.run(['python3','scripts/check_lean_axiom_log.py','/tmp/all-clipping.log',*names],check=True)
          PY
      - name: Exact carrier regressions when present
        run: |
          set -euo pipefail
          if test -f scripts/test_cone_carrier_descent.py; then
            python3 scripts/test_cone_carrier_descent.py --output /tmp/cone-carrier.json
            python3 scripts/check_carrier_regression.py /tmp/cone-carrier.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simultaneous-clipping-audit
          path: |
            /tmp/all-clipping.log
            /tmp/setup.log
            /tmp/cone-carrier.json
