name: Bootstrap separated common-face splitter publication

on:
  push:
    branches: [ops/publish-common-face-splitter]
    paths:
      - '.github/workflows/bootstrap-publish-common-face-splitter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore shared pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Build and audit source wrapper
        run: |
          set -euo pipefail
          lake build Definitions.Def_Hirsch_common_face_geometry Solutions.Sol_Hirsch_separated_common_face_split 2>&1 | tee /tmp/splitter-source.log
          python3 scripts/check_lean_axiom_log.py /tmp/splitter-source.log solution HirschPolynomialAccess.separated_common_face_split_core
      - name: Build and audit standalone proof
        run: |
          set -euo pipefail
          python3 scripts/bundle_public_common_face_tradeoff.py
          lake env lean public_common_face_packet/splitter_solution.lean 2>&1 | tee /tmp/splitter-standalone.log
          python3 scripts/check_lean_axiom_log.py /tmp/splitter-standalone.log solution
      - name: Publish verified splitter
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: python3 scripts/publish_common_face_splitter.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: separated-common-face-splitter-publication
          retention-days: 30
          path: |
            /tmp/splitter-source.log
            /tmp/splitter-standalone.log
            public_common_face_packet/splitter_solution.lean
            public_common_face_packet/manifest.json
            public_common_face_publish_receipts/
