name: Verify injective deletion cubic walk
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: verify-injective-deletion-cubic-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/injective-cubic-deletion-walk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit injective/deletion cubic walk
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialInjectiveCubicCircuitWalk
          lake build Solutions.PolynomialOneRowDeletionCubicCircuitWalk
          lake env lean Solutions/PolynomialInjectiveCubicCircuitWalk.lean 2>&1 | tee /tmp/injective-cubic.log
          lake env lean Solutions/PolynomialOneRowDeletionCubicCircuitWalk.lean 2>&1 | tee /tmp/deletion-cubic.log
          cat /tmp/injective-cubic.log /tmp/deletion-cubic.log > /tmp/injective-deletion-cubic.log
          python3 scripts/check_lean_axiom_log.py /tmp/injective-deletion-cubic.log \
            HirschCircuit.rowCircuitWalk_explicit_cubic_of_injective \
            HirschDeletion.rowsWithout_card_le \
            HirschDeletion.hpoly_rowsWithout_eq_deletionOuterSet \
            HirschDeletion.rowMap_rowsWithout_injective_of_bounded \
            HirschDeletion.rowCircuitWalk_explicit_cubic_of_one_row_deletion \
            HirschDeletion.rowCircuitWalk_explicit_cubic_of_deletionOuterSet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: injective-deletion-cubic-verification
          retention-days: 14
          path: /tmp/injective-deletion-cubic.log
          if-no-files-found: warn
