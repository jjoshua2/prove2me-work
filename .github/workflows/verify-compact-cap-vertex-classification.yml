name: Verify compact cap vertex classification
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: verify-compact-cap-vertices-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/compact-cap-vertex-classification'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Run exact regression, compile, and axiom-audit candidates
        run: bash scripts/verify_cap_vertex_candidate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-cap-vertex-classification-verification
          retention-days: 14
          path: |
            /tmp/cap-vertex-exact.json
            /tmp/compact-cap-vertices.log
            /tmp/deletion-cap-witness.log
          if-no-files-found: warn
