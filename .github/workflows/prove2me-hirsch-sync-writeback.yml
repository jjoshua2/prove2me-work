name: Prove2Me Hirsch sync writeback

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read

concurrency:
  group: prove2me-hirsch-sync-writeback
  cancel-in-progress: false

jobs:
  writeback:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'sync/prove2me-hirsch-20260911' &&
      github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check Actions policy
        run: python3 scripts/check_actions_policy.py
      - name: Reconcile status to Prove2Me mission board
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/sync_hirsch_to_prove2me.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prove2me-hirsch-sync-writeback
          retention-days: 14
          path: prove2me_hirsch_sync_writeback/
