name: One-shot common-face irredundant verification

on:
  push:
    branches: [formal/common-face-irredundant-model]

permissions:
  contents: read

concurrency:
  group: one-shot-common-face-irredundant
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore pinned Lean environment
        uses: ./.github/actions/setup-lean
      - name: Compile and audit normalization
        run: |
          set -euo pipefail
          mkdir -p /tmp/common-face-irredundant
          lake build \
            Solutions.CircuitIrredundantModel \
            Solutions.PolynomialCommonFaceIrredundantModel \
            Solutions.PolynomialCommonFaceRoutingModel \
            2>&1 | tee /tmp/common-face-irredundant/build.log
          ! grep -q sorryAx /tmp/common-face-irredundant/build.log
          python3 scripts/check_lean_axiom_log.py /tmp/common-face-irredundant/build.log \
            HirschCircuit.irredundant_rows_nonzero_of_mem \
            HirschCircuit.exists_irredundant_strict_model \
            HirschCircuitLocalization.commonFaceA_eq_zero_of_commonSourceRow \
            HirschCircuitLocalization.commonFace_coord_endpoint_separation \
            HirschCircuitLocalization.commonFace_coord_irredundant_strict_subpresentation \
            HirschCircuitLocalization.rowCircuit_commonFace_irredundant_strict_excess_defect \
            HirschCircuitLocalization.commonFace_coord_extreme_of_parent_extreme \
            HirschCircuitLocalization.commonFace_coord_target_extreme \
            HirschCircuitLocalization.commonFace_edgeRefinement_ready_model \
            HirschCircuitLocalization.rowCircuit_commonFace_edgeRefinement_ready_excess_defect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: common-face-irredundant
          retention-days: 7
          path: /tmp/common-face-irredundant/
