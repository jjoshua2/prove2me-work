name: Publish vertex slack-row bound once

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

concurrency:
  group: publish-vertex-slack-row-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'publish/vertex-slack-row-bound'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check policy and exact pins
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
          git cat-file -e 8a14d88e8bb61b11fd41c9fb7b3df8f08b3414ce^{commit}

      - name: Restore shared pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main

      - name: Build and audit exact public proof before credential access
        shell: bash
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialVertexSlackRowsPublic
          lake env lean Solutions/PolynomialVertexSlackRowsPublic.lean 2>&1 | tee /tmp/vertex-slack-source.log
          python3 scripts/check_lean_axiom_log.py /tmp/vertex-slack-source.log \
            Hirsch.vertex_strictly_slack_rows_card_le_row_excess
          python3 scripts/publish_vertex_slack_rows.py prepare | tee /tmp/vertex-slack-manifest.log
          lake env lean /tmp/vertex-slack-row-bound-public/solution.lean 2>&1 | tee /tmp/vertex-slack-standalone.log
          python3 scripts/check_lean_axiom_log.py /tmp/vertex-slack-standalone.log solution
          proof_hash="$(sha256sum /tmp/vertex-slack-row-bound-public/solution.lean | awk '{print $1}')"
          printf '%s\n' "$proof_hash" > /tmp/vertex-slack-row-bound-public/audit-passed.sha256

      - name: Authenticated preflight and publish audited proof
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prove2me_auth.py check
          python3 scripts/publish_vertex_slack_rows.py publish | tee /tmp/vertex-slack-publication.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vertex-slack-row-publication-receipts
          retention-days: 14
          path: |
            /tmp/vertex-slack-source.log
            /tmp/vertex-slack-manifest.log
            /tmp/vertex-slack-standalone.log
            /tmp/vertex-slack-publication.log
            /tmp/vertex-slack-row-bound-public/manifest.json
            /tmp/vertex-slack-row-bound-public/audit-passed.sha256
            vertex_slack_row_publication_receipts/
          if-no-files-found: warn
