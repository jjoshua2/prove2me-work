name: PR83 irredundant row-count verification

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr83-irredundant-row-count-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'chatgpt/irredundant-row-count-invariance' &&
      github.event.pull_request.number == 83
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check workflow policy and exact certificates
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          python3 scripts/check_irredundant_row_count.py --json | tee /tmp/irredundant-row-count-exact.json

      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main

      - name: Compile and audit row-count core
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialIrredundantRowCount
          lake env lean Solutions/PolynomialIrredundantRowCount.lean 2>&1 | tee /tmp/irredundant-row-count-core.log
          python3 scripts/check_lean_axiom_log.py /tmp/irredundant-row-count-core.log \
            HirschRowCount.strict_on_nonzero_rows_strict_for_valid_row \
            HirschRowCount.exists_nonzero_tight_row_of_valid_tight_row \
            HirschRowCount.exists_single_tight_point_of_irredundant \
            HirschRowCount.irredundant_rows_card_le_any_equivalent_presentation \
            HirschRowCount.strict_feasibility_transfers_to_equivalent_irredundant \
            HirschRowCount.equivalent_irredundant_row_counts_eq \
            HirschRowCount.exists_globally_minimal_irredundant_subpresentation

      - name: Compile and audit common-face adapters
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialCommonFaceIntrinsicRowCount
          lake env lean Solutions/PolynomialCommonFaceIntrinsicRowCount.lean 2>&1 | tee /tmp/irredundant-row-count-adapter.log
          python3 scripts/check_lean_axiom_log.py /tmp/irredundant-row-count-adapter.log \
            HirschCircuitLocalization.commonFace_minCount_eq_irredundant_subpresentation \
            HirschCircuitLocalization.commonFace_minCount_eq_any_irredundant_presentation

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr83-irredundant-row-count-verification
          retention-days: 7
          path: |
            /tmp/irredundant-row-count-exact.json
            /tmp/irredundant-row-count-core.log
            /tmp/irredundant-row-count-adapter.log
