name: Circuit edge-refinement hardness certificate
on:
  push:
    branches: [chatgpt/circuit-edge-hardness]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean and Mathlib
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y > /tmp/setup.log 2>&1
          ~/.elan/bin/lake exe cache get >> /tmp/setup.log 2>&1 || { tail -100 /tmp/setup.log; exit 1; }
      - name: Compile hardness equivalence and audit axioms
        run: |
          set -o pipefail
          ~/.elan/bin/lake build Solutions.CircuitEdgeRefinementHardness 2>&1 | tee /tmp/edge-hardness.log
          ! grep -q sorryAx /tmp/edge-hardness.log
          grep -F "'HirschCircuit.edge_refinement_iff_irredundant_strict_polynomial_diameter' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/edge-hardness.log
