name: Publish verified injective affine diameter transport

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read

concurrency:
  group: publish-affine-diameter-transport
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'publish/affine-diameter-transport' &&
      github.base_ref == 'formal/affine-diameter-transport'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check immutable source and Actions policy
        run: |
          set -euo pipefail
          git diff --exit-code be54654435d3c317d676f3ea03c79d07f089992a HEAD -- Solutions Definitions lean-toolchain lake-manifest.json lakefile.lean
          python3 scripts/check_actions_policy.py
          python3 -m py_compile scripts/publish_affine_diameter_transport.py
          python3 scripts/publish_affine_diameter_transport.py prepare
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit the exact standalone submission before credentials
        run: |
          set -euo pipefail
          lake build Definitions.Def_Hirsch_model
          lake env lean /tmp/affine-diameter-public/solution.lean 2>&1 | tee /tmp/affine-diameter-public/solution.log
          python3 scripts/check_lean_axiom_log.py /tmp/affine-diameter-public/solution.log solution
          sha256sum /tmp/affine-diameter-public/solution.lean | cut -d ' ' -f 1 > /tmp/affine-diameter-public/audit-passed.sha256
      - name: Authenticated registration, proof, and mission reference
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/prove2me_auth.py check
          python3 scripts/publish_affine_diameter_transport.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: affine-diameter-publication-receipts
          retention-days: 14
          path: |
            affine_diameter_publication_receipts/
            /tmp/affine-diameter-public/solution.lean
            /tmp/affine-diameter-public/solution.log
            /tmp/affine-diameter-public/manifest.json
            /tmp/affine-diameter-public/audit-passed.sha256
