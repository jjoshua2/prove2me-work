name: Verify injective carrier parent routing
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: verify-injective-carrier-routing-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/injective-carrier-parent-routing'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit injective carrier routing
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialInjectiveFacePortals Solutions.PolynomialInjectiveCarrierParentRouting
          lake env lean Solutions/PolynomialInjectiveCarrierParentRouting.lean 2>&1 | tee /tmp/injective-carrier-routing.log
          python3 scripts/check_lean_axiom_log.py /tmp/injective-carrier-routing.log \
            HirschPointed.route_of_feasible_commonFace_parent_routes_of_rowMap_injective
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: injective-carrier-parent-routing-verification
          retention-days: 14
          path: /tmp/injective-carrier-routing.log
          if-no-files-found: warn
