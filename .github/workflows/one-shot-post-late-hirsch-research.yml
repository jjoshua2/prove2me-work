name: One-shot post late Hirsch research status

on:
  push:
    branches: [publish/late-hirsch-research-2026-09-10]

permissions:
  contents: read

concurrency:
  group: one-shot-post-late-hirsch-research
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Post research-only mission update and verify readback
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: python3 scripts/post_late_hirsch_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: late-hirsch-research-status-receipts
          retention-days: 30
          if-no-files-found: warn
          path: prove2me_late_research_receipts/
