name: Verify and submit exact Child A direct proof
on:
  push:
    branches: [chatgpt/natura-submit-child-a]
    paths:
      - 'Solutions/**'
      - 'Definitions/**'
      - 'Theorems/Thm_Hirsch_cubic_circuit_walk_bound.lean'
      - 'scripts/submit_child_a_direct.py'
      - 'scripts/publish_natura_helpers.py'
      - '.github/workflows/submit-child-a-direct.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: natura-submit-child-a
  cancel-in-progress: false
jobs:
  verify-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean and Mathlib
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y > /tmp/setup.log 2>&1
          ~/.elan/bin/lake exe cache get >> /tmp/setup.log 2>&1 || { tail -80 /tmp/setup.log; exit 1; }
      - name: Require full modular cubic-route proof
        run: |
          set -o pipefail
          mkdir -p child_a_submission
          ~/.elan/bin/lake build Solutions.CircuitPhaseRoute 2>&1 | tee child_a_submission/modular-build.log
          ! grep -q sorryAx child_a_submission/modular-build.log
      - name: Audit standalone exact proof and submit to existing target
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: python3 scripts/submit_child_a_direct.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-child-a-submission
          path: child_a_submission/
          retention-days: 30
