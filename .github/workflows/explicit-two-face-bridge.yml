name: Explicit two-face bridge
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: explicit-two-face-bridge
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile explicit bridge and audit axioms
        run: |
          set -o pipefail
          lake build Solutions.PolynomialExplicitTwoFaceBridge 2>&1 | tee /tmp/explicit-two-face.log
          ! grep -q sorryAx /tmp/explicit-two-face.log
          grep -F "'HirschPolynomialAccess.walk_of_explicit_face_two_face_bridge' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/explicit-two-face.log
          grep -F "'HirschPolynomialAccess.quadratic_walk_of_explicit_two_face_bridge' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/explicit-two-face.log
          grep -F "'HirschPolynomialAccess.quadratic_diameter_of_explicit_two_face_bridge_property' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/explicit-two-face.log
