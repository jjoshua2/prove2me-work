name: Full clipped diameter

on:
  push:
    branches: [chatgpt/clipped-diameter]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipped-diameter-proof
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read current public theorem state
        run: |
          python3 - <<'PY'
          import datetime,json,pathlib,urllib.request
          from html.parser import HTMLParser
          out=pathlib.Path('clipped_diameter_packet');out.mkdir(exist_ok=True)
          class Text(HTMLParser):
            def __init__(self):super().__init__();self.parts=[];self.skip=0
            def handle_starttag(self,t,a):
              if t in ('script','style'):self.skip+=1
            def handle_endtag(self,t):
              if t in ('script','style'):self.skip=max(0,self.skip-1)
            def handle_data(self,s):
              if not self.skip and s.strip():self.parts.append(s.strip())
          urls={
            'accepted_product':'https://prove2.me/theorems/cf9699ad-34c6-4202-8b4a-10177c844813',
            'accepted_cut':'https://prove2.me/theorems/7d78c1ee-f7f7-439b-99f9-8210bb1b5de6',
            'open_leaf':'https://prove2.me/theorems/33fc334e-e05b-4090-ac49-f83fd94d9305',
            'mission':'https://prove2.me/missions/The%20Polynomial%20Hirsch%20Conjecture',
            'related_api':'https://prove2.me/api/v1/theorems?q=clipped&env=c5ea00351c28e24afc9f0f84379aa41082b1188f&limit=100'}
          report={'fetched_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'reads':[]}
          for name,url in urls.items():
            row={'name':name,'url':url}
            try:
              with urllib.request.urlopen(url,timeout=25) as response:
                row['http_status']=response.status;raw=response.read().decode()
              p=Text();p.feed(raw);text='\n'.join(p.parts)
              (out/(name+'.txt')).write_text(text)
              row['text_file']=name+'.txt'
              start=max(0,text.find('Frontier')) if name=='mission' else 0
              print(name,text[start:start+1400])
            except Exception as exc:row['error']=str(exc);print(name,repr(exc))
            report['reads'].append(row)
          (out/'live-frontier.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib cache
        run: ~/.elan/bin/lake exe cache get
      - name: Compile complete geometric proof
        run: |
          set -o pipefail
          ~/.elan/bin/lake build Solutions.PolynomialClippedDiameterSubmission 2>&1 | tee clipped_diameter_packet/build.log
      - name: Independently compile exact proof files and reject admitted dependencies
        run: python3 scripts/bundle_clipped_diameter.py
      - name: Upload exact proof packet and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipped-diameter-proof-packet
          path: clipped_diameter_packet/
          if-no-files-found: error
