name: Verify direct target-access reduction
on:
  push:
    branches: [chatgpt/direct-target-access-reduction]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-target-access-direct-reduction
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pinned environment
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit direct reduction
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialTargetAccessDirectReduction 2>&1 | tee /tmp/direct-target-reduction.log
          python3 scripts/check_lean_axiom_log.py /tmp/direct-target-reduction.log \
            Hirsch.diameter_bound_of_target_face_access \
            Hirsch.polynomial_hirsch_of_target_face_access
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-access-direct-reduction-audit
          retention-days: 3
          path: /tmp/direct-target-reduction.log
