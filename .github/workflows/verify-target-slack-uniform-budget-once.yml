name: Verify target-slack uniform budget once

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

concurrency:
  group: target-slack-uniform-budget-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/target-slack-uniform-budget'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore shared pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit uniform row-excess budget
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialTargetSlackUniformBudget
          lake env lean Solutions/PolynomialTargetSlackUniformBudget.lean 2>&1 | tee /tmp/target-slack-uniform.log
          python3 scripts/check_lean_axiom_log.py /tmp/target-slack-uniform.log \
            HirschTargetDeletion.target_slack_rows_card_le_rowExcess \
            HirschTargetDeletion.target_slack_batch_reinsertion_uniform_parent_face_bound
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-slack-uniform-budget-verification
          retention-days: 14
          path: /tmp/target-slack-uniform.log
          if-no-files-found: warn
