name: Lean check

on:
  push:
    branches: [chatgpt/spindle-axis]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
          key: lean430-c5ea003-v2
      - name: Install elan if needed
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        run: ~/.elan/bin/lake exe cache get
      - name: Build imported definitions
        run: ~/.elan/bin/lake build Definitions.Def_Hirsch_model Definitions.Def_Hirsch_wedge
      - name: Build symmetric core
        run: ~/.elan/bin/lake build Solutions.AxisSymScratch
      - name: Compile symmetric endpoint-extremality lemmas
        run: ~/.elan/bin/lake env lean Solutions/AxisSymExtremes.lean
      - name: Build product proof modules
        run: ~/.elan/bin/lake build Solutions.AxisProductScratch Solutions.AxisProductEdges Solutions.AxisWalkCompression
      - name: Compile complete redundant-row branch
        run: ~/.elan/bin/lake env lean Solutions/AxisProductBranch.lean
