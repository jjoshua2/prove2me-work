name: Lean check

on:
  push:
    branches: [chatgpt/spindle-axis]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
          key: lean430-c5ea003-v3
      - name: Install elan if needed
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        run: ~/.elan/bin/lake exe cache get
      - name: Build imported definitions
        run: ~/.elan/bin/lake build Definitions.Def_Hirsch_model Definitions.Def_Hirsch_wedge
      - name: Build symmetric structural front
        continue-on-error: true
        run: ~/.elan/bin/lake build Solutions.AxisSymScratch Solutions.AxisSymExtremes Solutions.AxisActive Solutions.AxisNormalize Solutions.AxisSideSelection
      - name: Compile structural perturbation selection
        continue-on-error: true
        run: ~/.elan/bin/lake env lean Solutions/AxisSymSelect.lean
      - name: Compile small-tilt boundedness
        continue-on-error: true
        run: ~/.elan/bin/lake env lean Solutions/AxisSymBounded.lean
      - name: Build zero-tilt geometry
        continue-on-error: true
        run: |
          ~/.elan/bin/lake env lean Solutions/AxisSymZero.lean
          ~/.elan/bin/lake build Solutions.AxisSymZero
      - name: Compile zero-wedge edge projection
        continue-on-error: true
        run: ~/.elan/bin/lake env lean Solutions/AxisSymZeroEdges.lean
      - name: Compile irredundant facet witnesses
        continue-on-error: true
        run: ~/.elan/bin/lake env lean Solutions/AxisIrredundant.lean
      - name: Build product proof modules
        continue-on-error: true
        run: ~/.elan/bin/lake build Solutions.AxisProductScratch Solutions.AxisProductEdges Solutions.AxisWalkCompression
      - name: Compile complete redundant-row branch
        continue-on-error: true
        run: ~/.elan/bin/lake env lean Solutions/AxisProductBranch.lean
