name: Verify logarithmic local-rank numerical refinement
on:
  push:
    branches: [chatgpt/target-access-equivalence]
permissions:
  contents: read
concurrency:
  group: verify-log-local-rank-numerics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pinned environment
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit numerical refinement
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialLogLocalRankNumerics 2>&1 | tee /tmp/log-local-rank-numerics.log
          python3 scripts/check_lean_axiom_log.py /tmp/log-local-rank-numerics.log \
            HirschLogRank.activeNeutralSpan_finrank_le_dim \
            HirschLogRank.activeNeutralSpan_finrank_le_neutral_card \
            HirschLogRank.large_local_neutral_rank_implies_double_hard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-local-rank-numerics-audit
          retention-days: 3
          path: /tmp/log-local-rank-numerics.log
          if-no-files-found: warn
