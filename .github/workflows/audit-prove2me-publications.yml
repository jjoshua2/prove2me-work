name: Audit Prove2Me publications

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prove2me-publication-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Query live pinned theorem statuses
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$PROVE2ME_API_KEY"
          python3 scripts/audit_prove2me_publications.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prove2me-publication-audit
          retention-days: 30
          path: publication_backlog_audit/audit.json
