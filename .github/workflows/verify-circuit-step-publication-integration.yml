name: Verify circuit-step publication integration
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: read
concurrency:
  group: verify-circuit-step-publication-integration
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'integrate/circuit-step-publications'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile integrated exact source and adapters
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialCircuitStepBlockerCharacterization \
            Definitions.Def_Hirsch_common_face_geometry \
            Definitions.Def_Hirsch_circuit_slack_model
          lake env lean Solutions/Sol_Hirsch_maximal_row_circuit_step_carrier_bound.lean 2>&1 | tee /tmp/carrier.log
          lake env lean Solutions/Sol_Hirsch_row_circuit_step_swap_iff_tight_blockers.lean 2>&1 | tee /tmp/swap.log
          python3 scripts/check_lean_axiom_log.py /tmp/carrier.log solution
          python3 scripts/check_lean_axiom_log.py /tmp/swap.log solution
      - name: Authenticated Prove2Me 0.10.0 publication audit
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: python3 scripts/audit_prove2me_publications_v010.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuit-step-publication-integration-audit
          retention-days: 14
          path: |
            publication_backlog_audit/audit.json
            /tmp/carrier.log
            /tmp/swap.log
