name: Verify simultaneous clipping shortest pair legs once

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: clip-shortest-pair-legs-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/simultaneous-clip-shortest-pair-legs' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit shortest clipping pair legs
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialSimultaneousClipShortestPairLegs
          lake env lean Solutions/PolynomialSimultaneousClipShortestPairLegs.lean 2>&1 | tee /tmp/clip-shortest-pair-legs.log
          python3 scripts/check_lean_axiom_log.py /tmp/clip-shortest-pair-legs.log \
            HirschRadial.clipRepairPathRegion \
            HirschRadial.route_clip_of_lifted_endpoints_with_shortest_pair_specific_cut_legs \
            HirschRadial.route_clip_with_shortest_pair_specific_cut_legs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simultaneous-clip-shortest-pair-legs-verification
          retention-days: 14
          path: /tmp/clip-shortest-pair-legs.log
          if-no-files-found: warn
