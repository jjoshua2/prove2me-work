name: Verify radial active-row intervals
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
permissions:
  contents: read
concurrency:
  group: verify-radial-active-row-interval-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/radial-active-row-interval' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit radial active-row intervals
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialRadialActiveRowInterval
          lake env lean Solutions/PolynomialRadialActiveRowInterval.lean 2>&1 | tee /tmp/radial-active-row-interval.log
          python3 scripts/check_lean_axiom_log.py /tmp/radial-active-row-interval.log \
            HirschRadial.normalizedRow_affine_combo \
            HirschRadial.scale_eq_row_on_combo_of_endpoints \
            HirschRadial.activeRowCell_convex \
            HirschRadial.retract_mem_active_cut_of_mem_activeRowCell \
            HirschRadial.retract_image_segment_subset_active_cut
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radial-active-row-interval-verification
          retention-days: 14
          path: /tmp/radial-active-row-interval.log
          if-no-files-found: warn
