name: Verify balanced pair-face cover
on:
  push:
    branches: [chatgpt/target-access-equivalence]
permissions:
  contents: read
concurrency:
  group: verify-balanced-pair-face-cover-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pinned environment
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit pair-face averaging
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialBalancedPairFaceCover 2>&1 | tee /tmp/balanced-pair-face-cover.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/balanced-pair-face-cover.log').read_text(encoding='utf-8')
          names=[
            'HirschBalancedFaceCover.nonzeroRowPairFace_isExtreme',
            'HirschBalancedFaceCover.row_face_vertex_pair_multiplicity',
            'HirschBalancedFaceCover.row_face_diamLE_of_pair_face_bounds',
          ]
          allowed={'propext','Classical.choice','Quot.sound'}
          pat=re.compile(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",re.S)
          reports={n:{x.strip() for x in raw.split(',') if x.strip()} for n,raw in pat.findall(text)}
          for n in re.findall(r"'([^']+)' does not depend on any axioms",text): reports[n]=set()
          for n in names:
            if n not in reports: raise SystemExit('missing axiom report for '+n)
            bad=reports[n]-allowed
            if bad: raise SystemExit(f'unexpected axioms for {n}: {sorted(bad)}')
            print(n,sorted(reports[n]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balanced-pair-face-cover-audit
          retention-days: 3
          path: /tmp/balanced-pair-face-cover.log
          if-no-files-found: warn
