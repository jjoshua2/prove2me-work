name: One-shot integration build circuit rank defect

on:
  push:
    branches: [formal/circuit-neutral-rank]

permissions:
  contents: read

concurrency:
  group: one-shot-integration-circuit-rank-defect
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore pinned Lean environment
        uses: ./.github/actions/setup-lean
      - name: Build every concrete project module
        run: |
          set -euo pipefail
          mapfile -t targets < <(
            find Definitions Solutions Theorems -type f -name '*.lean' -print \
              | sed -e 's#/#.#g' -e 's#\.lean$##' \
              | sort
          )
          test "${#targets[@]}" -gt 0
          printf 'Building %s concrete Lean modules\n' "${#targets[@]}"
          lake build "${targets[@]}"
