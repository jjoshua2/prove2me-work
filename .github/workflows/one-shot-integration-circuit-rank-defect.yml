name: One-shot integration build circuit rank defect

on:
  push:
    branches: [formal/circuit-neutral-rank]

permissions:
  contents: read

concurrency:
  group: one-shot-integration-circuit-rank-defect
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore pinned Lean environment
        uses: ./.github/actions/setup-lean
      - name: Full Lake build
        run: |
          set -euo pipefail
          lake build
