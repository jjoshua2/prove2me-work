name: One-shot pinned Lean environment export
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: read
concurrency:
  group: export-pinned-lean-environment
  cancel-in-progress: true
jobs:
  export:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'ops/export-pinned-lean-environment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check cost policy
        run: python3 scripts/check_actions_policy.py
      - uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Export public toolchain, dependency cache, and tracked source only
        run: |
          set -euo pipefail
          mkdir -p /tmp/lean-export
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          git ls-files -z | tar --null -T - -I 'zstd -T2 -3' -cf /tmp/lean-export/source.tar.zst
          tar -C "$HOME/.elan/toolchains" -I 'zstd -T2 -3' \
            -cf /tmp/lean-export/toolchain.tar.zst leanprover--lean4---v4.30.0
          tar --exclude='.git' --exclude='credentials.json' --exclude='.env' \
            -I 'zstd -T2 -3' -cf /tmp/lean-export/lake.tar.zst .lake
          cd /tmp/lean-export
          sha256sum *.tar.zst | tee SHA256SUMS
      - name: Split environment for attachment transport
        run: |
          set -euo pipefail
          cd /tmp/lean-export
          tar -cf - SHA256SUMS source.tar.zst toolchain.tar.zst lake.tar.zst | split -d -b 400M - env.part.
      - uses: actions/upload-artifact@v4
        with:
          name: lean-offline-part-00
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
          path: /tmp/lean-export/env.part.00
      - uses: actions/upload-artifact@v4
        with:
          name: lean-offline-part-01
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
          path: /tmp/lean-export/env.part.01
      - uses: actions/upload-artifact@v4
        with:
          name: lean-offline-part-02
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
          path: /tmp/lean-export/env.part.02
      - uses: actions/upload-artifact@v4
        with:
          name: lean-offline-part-03
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
          path: /tmp/lean-export/env.part.03
      - uses: actions/upload-artifact@v4
        with:
          name: lean-offline-part-04
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
          path: /tmp/lean-export/env.part.04
      - uses: actions/upload-artifact@v4
        with:
          name: lean-offline-part-05
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
          path: /tmp/lean-export/env.part.05
      - uses: actions/upload-artifact@v4
        with:
          name: lean-offline-part-06
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
          path: /tmp/lean-export/env.part.06
      - uses: actions/upload-artifact@v4
        with:
          name: lean-offline-part-07
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
          path: /tmp/lean-export/env.part.07
