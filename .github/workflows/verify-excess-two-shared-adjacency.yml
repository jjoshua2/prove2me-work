name: Verify excess-two shared-index adjacency
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: read
concurrency:
  group: excess-two-shared-adjacency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/excess-two-shared-adjacency'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit adjacency package
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialExcessTwoConvexity Solutions.PolynomialExcessTwoSharedAdjacency 2>&1 | tee /tmp/excess-two-adjacency.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/excess-two-adjacency.log').read_text(encoding='utf-8')
          names=[
            'HirschExcessTwo.momentSlice_convex',
            'HirschExcessTwo.segment_subset_supportFace',
            'HirschExcessTwo.sum_eq_add_add_of_zero_off_triple',
            'HirschExcessTwo.supportFace_triple_eq_segment_shared_low',
            'HirschExcessTwo.pairPoint_adj_shared_low',
            'HirschExcessTwo.supportFace_triple_eq_segment_shared_high',
            'HirschExcessTwo.pairPoint_adj_shared_high',
            'HirschExcessTwo.pairPoint_two_step_route',
          ]
          allowed={'propext','Classical.choice','Quot.sound'}
          pat=re.compile(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",re.S)
          reports={n:{x.strip() for x in raw.split(',') if x.strip()} for n,raw in pat.findall(text)}
          for n in re.findall(r"'([^']+)' does not depend on any axioms",text): reports[n]=set()
          for n in names:
            if n not in reports: raise SystemExit('missing axiom report for '+n)
            bad=reports[n]-allowed
            if bad: raise SystemExit(f'unexpected axioms for {n}: {sorted(bad)}')
            print(n, sorted(reports[n]))
          print('PASS: excess-two shared-index adjacency package audited')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: excess-two-shared-adjacency-audit
          retention-days: 7
          path: /tmp/excess-two-adjacency.log
