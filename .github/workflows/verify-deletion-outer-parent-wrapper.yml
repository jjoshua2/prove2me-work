name: Verify deletion outer to parent routing
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: verify-deletion-outer-parent-wrapper-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/deletion-outer-diam-parent-wrapper'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit deletion outer parent wrapper
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialDeletionOuterToParentRouting
          lake env lean Solutions/PolynomialDeletionOuterToParentRouting.lean 2>&1 | tee /tmp/deletion-outer-parent-wrapper.log
          python3 scripts/check_lean_axiom_log.py /tmp/deletion-outer-parent-wrapper.log \
            HirschDeletionRouting.hpoly_diamLE_of_deletionOuter_diam_and_parent_face_route \
            HirschDeletionRouting.hpoly_diamLE_of_deletionOuter_diam_and_parent_face_route_of_strictRows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deletion-outer-parent-wrapper-verification
          retention-days: 14
          path: /tmp/deletion-outer-parent-wrapper.log
          if-no-files-found: warn
