name: Quadratic two-face bridge
on:
  push:
    branches: [chatgpt/two-face-polynomial-bridge]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: two-face-polynomial-bridge
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean and Mathlib
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y > /tmp/setup.log 2>&1
          ~/.elan/bin/lake exe cache get >> /tmp/setup.log 2>&1 || { tail -100 /tmp/setup.log; exit 1; }
      - name: Compile bridge recurrence and audit axioms
        run: |
          set -o pipefail
          ~/.elan/bin/lake build \
            Solutions.PolynomialFaceSparsePresentation \
            Solutions.PolynomialTwoFaceBridge \
            2>&1 | tee /tmp/two-face.log
          ! grep -q sorryAx /tmp/two-face.log
          grep -F "'HirschPolynomialAccess.quadratic_walk_of_sparse_two_face_bridge' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/two-face.log
          grep -F "'HirschPolynomialAccess.quadratic_diameter_of_two_face_bridge_property' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/two-face.log
