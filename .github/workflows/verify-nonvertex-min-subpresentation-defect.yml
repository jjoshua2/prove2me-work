name: Verify nonvertex minimum-subpresentation defect

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: nonvertex-min-subpresentation-defect-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.head_ref == 'formal/nonvertex-min-subpresentation-defect'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit checkpoint defect theorems
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialCircuitCheckpointMinSubpresentationDefect 2>&1 | tee /tmp/nonvertex-min-defect.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/nonvertex-min-defect.log').read_text(encoding='utf-8')
          names=[
            'HirschCircuitLocalization.rowCircuit_selectedEffectiveRows_defect_budget_of_reference_vertex',
            'HirschCircuitLocalization.rowCircuit_selectedEffectiveRows_excess_defect_of_reference_vertex',
            'HirschCircuitLocalization.commonFace_minSubpresentation_effective_witness_of_feasible',
            'HirschCircuitLocalization.commonFaceDim_le_minSubpresentation_of_bounded_feasible',
            'HirschCircuitLocalization.rowCircuit_commonFace_minSubpresentation_excess_defect_checkpoint',
          ]
          allowed={'propext','Classical.choice','Quot.sound'}
          pat=re.compile(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",re.S)
          reports={n:{x.strip() for x in raw.split(',') if x.strip()} for n,raw in pat.findall(text)}
          for n in re.findall(r"'([^']+)' does not depend on any axioms",text): reports[n]=set()
          for name in names:
            if name not in reports: raise SystemExit('missing axiom report for '+name)
            bad=reports[name]-allowed
            if bad: raise SystemExit(f'unexpected axioms for {name}: {sorted(bad)}')
            print(name, sorted(reports[name]))
          print('PASS: nonvertex checkpoint minimum-subpresentation defect audited')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonvertex-min-subpresentation-defect-audit
          retention-days: 3
          path: /tmp/nonvertex-min-defect.log
          if-no-files-found: warn
