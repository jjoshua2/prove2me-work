name: Verify injective minimum-carrier dichotomy
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: verify-injective-min-carrier-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/injective-min-carrier-dichotomy'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit injective minimum-carrier dichotomy
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialCommonFaceInjectivePresentations Solutions.PolynomialCircuitInjectiveMinCarrierDichotomy
          lake env lean Solutions/PolynomialCircuitInjectiveMinCarrierDichotomy.lean 2>&1 | tee /tmp/injective-min-carrier.log
          python3 scripts/check_lean_axiom_log.py /tmp/injective-min-carrier.log \
            HirschCircuitLocalization.rowCircuit_saturated_selected_contains_effective_nonneutral_of_injective \
            HirschCircuitLocalization.rowCircuitStep_saturated_selected_target_blocker_of_injective \
            HirschCircuitLocalization.rowCircuitStep_saturated_same_phase_selected_target_positive_blocker_of_injective \
            HirschCircuitLocalization.rowCircuitStep_irredundant_minPresentation_same_phase_strict_budget_or_essential_trapped_blocker_of_injective
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: injective-min-carrier-dichotomy-verification
          retention-days: 14
          path: /tmp/injective-min-carrier.log
          if-no-files-found: warn
