name: Verify compact public excess-two carrier driver
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
concurrency:
  group: compact-excess-two-carrier-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'publish/excess-two-common-carrier'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit compact driver
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialExcessTwoCarrierPublicDriver 2>&1 | tee /tmp/compact-excess-two-driver.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/compact-excess-two-driver.log').read_text()
          names=[
            'HirschExcessTwoPublic.common_face_has_subpresentation_dim_add_two_of_rows_le_dim_add_two',
            'HirschExcessTwoPublic.excess_two_common_carrier_from_proved_inputs',
          ]
          allowed={'propext','Classical.choice','Quot.sound'}
          pat=re.compile(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",re.S)
          reports={n:{x.strip() for x in raw.split(',') if x.strip()} for n,raw in pat.findall(text)}
          for n in re.findall(r"'([^']+)' does not depend on any axioms",text): reports[n]=set()
          for name in names:
            if name not in reports: raise SystemExit('missing axiom report for '+name)
            bad=reports[name]-allowed
            if bad: raise SystemExit(f'unexpected axioms for {name}: {sorted(bad)}')
            print(name, sorted(reports[name]))
          print('PASS: compact public excess-two carrier driver audited')
          PY
