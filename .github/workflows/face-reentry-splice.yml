name: Extreme-face reentry splice
on:
  push:
    branches: [chatgpt/face-reentry-splice]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: face-reentry-splice
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean and Mathlib
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y > /tmp/setup.log 2>&1
          ~/.elan/bin/lake exe cache get >> /tmp/setup.log 2>&1 || { tail -100 /tmp/setup.log; exit 1; }
      - name: Compile splice and audit axioms
        run: |
          set -o pipefail
          ~/.elan/bin/lake build Solutions.PolynomialFaceReentrySplice 2>&1 | tee /tmp/face-splice.log
          ! grep -q sorryAx /tmp/face-splice.log
          grep -F "'HirschFaceSplice.splice_reentry_through_extreme_face' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/face-splice.log
          grep -F "'HirschFaceSplice.splice_reentry_no_growth' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/face-splice.log
          grep -F "'HirschFaceSplice.splice_reentry_cost_at_most_face_diameter' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/face-splice.log
