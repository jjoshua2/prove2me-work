name: Extreme-face splice, geodesic cover and tail
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: face-reentry-splice
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact hull and all-geodesic regression
        run: python3 scripts/test_geodesic_face_cover.py
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile splice, geodesic cover and ordered tail
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialGeodesicFaceTail 2>&1 | tee /tmp/face-splice.log
          python3 scripts/check_lean_axiom_log.py /tmp/face-splice.log \
            HirschFaceSplice.splice_reentry_through_extreme_face \
            HirschFaceSplice.splice_reentry_no_growth \
            HirschFaceSplice.splice_reentry_cost_at_most_face_diameter \
            HirschFaceSplice.shortest_face_visit_span_le \
            HirschFaceSplice.shortest_face_visit_card_le \
            HirschFaceSplice.shortest_face_cover_budget \
            HirschFaceSplice.diamLE_of_face_cover \
            HirschFaceSplice.shortest_no_repeat_of_le \
            HirschFaceSplice.shortest_face_disjoint_tail_budget \
            HirschFaceSplice.diamLE_of_disjoint_face_tail_bound
