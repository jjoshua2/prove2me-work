name: Unbounded outer cut routing

on:
  push:
    branches: [chatgpt/unbounded-cut-routing]

concurrency:
  group: unbounded-cut-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read live public Prove2Me approvals and frontier
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, json, pathlib, urllib.request, urllib.error
          from html.parser import HTMLParser
          from urllib.parse import urlencode, urljoin
          out=pathlib.Path('unbounded_cut_packet'); out.mkdir(exist_ok=True)
          class Page(HTMLParser):
            def __init__(self):
              super().__init__(); self.parts=[]; self.links=[]; self.skip=0; self.link=None
            def handle_starttag(self, tag, attrs):
              if tag in ('script','style'): self.skip += 1
              if tag == 'a':
                self.link=[dict(attrs).get('href',''),'']
            def handle_endtag(self, tag):
              if tag in ('script','style'): self.skip=max(0,self.skip-1)
              if tag == 'a' and self.link is not None:
                self.links.append(tuple(self.link)); self.link=None
            def handle_data(self, value):
              if not self.skip and value.strip(): self.parts.append(value.strip())
              if self.link is not None: self.link[1] += value
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Prove2Me-proof-workspace','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=30) as response: return response.read().decode('utf-8')
          record={'fetched_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'theorems':[]}
          user='https://prove2.me/users/c7399005-c54f-46c6-83fd-0131738d1e3f'
          try:
            p=Page(); p.feed(get(user)); text='\n'.join(p.parts)
            (out/'live-user.txt').write_text(text); print('LIVE_USER\n'+text[:14000])
            urls={urljoin(user,u) for u,label in p.links if '/theorems/' in u and
                  any(word in label.lower() for word in ('rank','clipp','outer','cut','supporting','factor'))}
          except Exception as e:
            record['user_error']=str(e); urls=set()
          urls.update(['https://prove2.me/theorems/33fc334e-e05b-4090-ac49-f83fd94d9305',
                       'https://prove2.me/theorems/68453b6b-bcef-4672-b877-d04e56527e3f',
                       'https://prove2.me/theorems/b00a957b-6355-4fce-8083-b53825b2270d'])
          def theorem(url):
            row={'url':url}
            try:
              p=Page(); p.feed(get(url)); text='\n'.join(p.parts)
              ident=url.rstrip('/').split('/')[-1]
              (out/('live-'+ident+'.txt')).write_text(text)
              row['name']=next((s for s in p.parts if s.startswith('Hirsch.')),None)
              row['status']=next((s for s in p.parts[:65] if s in ('Proved','Open','Disproved')),None)
              row['text_file']='live-'+ident+'.txt'
            except Exception as e: row['error']=str(e)
            return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
            record['theorems']=list(pool.map(theorem,sorted(urls)))
          mission='https://prove2.me/missions/The%20Polynomial%20Hirsch%20Conjecture'
          try:
            p=Page(); p.feed(get(mission)); text='\n'.join(p.parts)
            (out/'live-mission.txt').write_text(text)
            start=text.find('Frontier'); record['frontier_excerpt']=text[start:start+2000] if start>=0 else 'Frontier label not found'
          except Exception as e: record['mission_error']=str(e)
          api='https://prove2.me/api/v1/theorems?'+urlencode({'q':'cut','env':'c5ea00351c28e24afc9f0f84379aa41082b1188f','limit':100})
          try: record['related_api']=json.loads(get(api))
          except Exception as e: record['related_api_error']=str(e)
          (out/'live-state.json').write_text(json.dumps(record,indent=2)+'\n')
          print('LIVE_STATE',json.dumps(record,indent=2))
          PY
      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib cache
        run: ~/.elan/bin/lake exe cache get
      - name: Build admission-free unbounded-cut geometric core
        run: |
          set -o pipefail
          ~/.elan/bin/lake build Solutions.PolynomialUnboundedCutCore 2>&1 | tee unbounded_cut_packet/geometry-build.log
      - name: Build exact H-polyhedron submissions
        run: |
          set -o pipefail
          ~/.elan/bin/lake build Solutions.PolynomialUnboundedCutAccessSubmission Solutions.PolynomialUnboundedCutDiameterSubmission 2>&1 | tee unbounded_cut_packet/final-build.log
      - name: Independently compile and audit bundled submission files
        run: python3 scripts/bundle_unbounded_cut.py
      - name: Upload exact proof packets and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unbounded-cut-proof-packets
          path: unbounded_cut_packet/
          if-no-files-found: warn
