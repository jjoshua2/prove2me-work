name: Verify injective circuit-step progress
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: verify-injective-step-progress-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/injective-step-progress'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit injective circuit-step progress
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialCircuitInjectiveCheckpointLocalization
          lake build Solutions.PolynomialCircuitInjectiveStepProgress
          lake build Solutions.PolynomialOneRowDeletionStepProgress
          lake env lean Solutions/PolynomialCircuitInjectiveCheckpointLocalization.lean 2>&1 | tee /tmp/injective-checkpoint.log
          lake env lean Solutions/PolynomialCircuitInjectiveStepProgress.lean 2>&1 | tee /tmp/injective-step.log
          lake env lean Solutions/PolynomialOneRowDeletionStepProgress.lean 2>&1 | tee /tmp/deletion-step.log
          cat /tmp/injective-checkpoint.log /tmp/injective-step.log /tmp/deletion-step.log > /tmp/injective-step-progress.log
          python3 scripts/check_lean_axiom_log.py /tmp/injective-step-progress.log \
            HirschCircuitLocalization.directionNeutralDefect_eq_zero_of_rowCircuit_of_injective \
            HirschCircuitLocalization.rowCircuit_commonFaceDim_checkpoint_localization_of_injective \
            HirschCircuitLocalization.rowCircuitStep_commonFaceDim_source_bound_of_injective \
            HirschCircuitLocalization.rowCircuitStep_target_commonFaceDim_progress_of_injective \
            HirschDeletion.rowCircuitStep_commonFaceDim_source_bound_of_one_row_deletion \
            HirschDeletion.rowCircuitStep_target_commonFaceDim_progress_of_one_row_deletion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: injective-step-progress-verification
          retention-days: 14
          path: /tmp/injective-step-progress.log
          if-no-files-found: warn
