name: Verify phase blocker persistence
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
concurrency:
  group: phase-blocker-persistence-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/phase-blocker-persistence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit blocker persistence
        run: |
          set -euo pipefail
          lake build Solutions.CircuitPhaseBlockerPersistence 2>&1 | tee /tmp/phase-blocker-persistence.log
          python3 scripts/check_lean_axiom_log.py /tmp/phase-blocker-persistence.log \
            HirschCircuit.standardSlice_line_affine_mem \
            HirschCircuit.standardCircuitStep_exists_zero_blocker \
            HirschCircuit.same_phase_zero_blocker_is_trapped_positive \
            HirschCircuit.standardCircuitStep_same_phase_has_trapped_positive_blocker
