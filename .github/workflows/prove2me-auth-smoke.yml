name: Prove2Me auth smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Require repository secret
        shell: bash
        run: |
          if [[ -z "${PROVE2ME_API_KEY:-}" ]]; then
            echo "::error::Repository secret PROVE2ME_API_KEY is not configured or is unavailable to this workflow."
            exit 1
          fi
          echo "repository_secret_present=true"

      - name: Check DNS, health, refresh, and authenticated API read
        run: python3 scripts/prove2me_auth.py check --no-write
