name: Verify pointed lower-excess carrier routing once
on:
  pull_request:
    types: [ready_for_review]
permissions:
  contents: read
concurrency:
  group: pointed-lower-excess-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/pointed-lower-excess-carrier-routing'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1c5d93a916dea43ae53b80a928a1d9ca993c3f3
          persist-credentials: false
      - name: Check frozen source and pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd1c5d93a916dea43ae53b80a928a1d9ca993c3f3'
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
          echo '92f45288ab05a53bc5b36af183fc375b1bbdc29b42942388ade9d5d75d31bb73  Solutions/PolynomialPointedLowerExcessCarrierRecursion.lean' | sha256sum -c -
          python3 scripts/check_actions_policy.py
      - name: Restore shared pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile exact target and audit four declarations
        shell: bash
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialPointedLowerExcessCarrierRecursion 2>&1 | tee /tmp/pointed-lower-excess-build.log
          lake env lean Solutions/PolynomialPointedLowerExcessCarrierRecursion.lean 2>&1 | tee /tmp/pointed-lower-excess-axioms.log
          python3 scripts/check_lean_axiom_log.py /tmp/pointed-lower-excess-axioms.log \
            HirschCircuitLocalization.commonFace_diamLE_of_minPresentationExcess_lt_of_injective \
            HirschCircuitLocalization.feasible_sequence_edge_route_sum_of_strict_carriers_of_injective \
            HirschCircuitLocalization.feasible_sequence_edge_route_mul_of_strict_carriers_of_injective \
            HirschCircuitLocalization.rowCircuitStep_same_phase_recursive_or_essential_trapped_blocker_of_injective
          git rev-parse HEAD > /tmp/pointed-lower-excess-source-commit.txt
          sha256sum Solutions/PolynomialPointedLowerExcessCarrierRecursion.lean > /tmp/pointed-lower-excess-source-sha256.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pointed-lower-excess-carrier-verification
          retention-days: 14
          if-no-files-found: error
          path: |
            /tmp/pointed-lower-excess-build.log
            /tmp/pointed-lower-excess-axioms.log
            /tmp/pointed-lower-excess-source-commit.txt
            /tmp/pointed-lower-excess-source-sha256.txt
