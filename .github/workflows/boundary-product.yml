name: Boundary product access

on:
  push:
    branches: [chatgpt/boundary-product-access]

concurrency:
  group: boundary-product-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read current public frontier
        run: |
          python3 - <<'PY'
          import datetime,json,pathlib,urllib.request
          from html.parser import HTMLParser
          out=pathlib.Path('boundary_product_packet'); out.mkdir(exist_ok=True)
          class Text(HTMLParser):
            def __init__(self): super().__init__(); self.parts=[]; self.skip=0
            def handle_starttag(self,t,a):
              if t in ('script','style'): self.skip+=1
            def handle_endtag(self,t):
              if t in ('script','style'): self.skip=max(0,self.skip-1)
            def handle_data(self,s):
              if not self.skip and s.strip(): self.parts.append(s.strip())
          urls={
            'accepted_residual':'https://prove2.me/theorems/7eeb1ee6-c837-4814-943c-2d39cf6fc4a7',
            'accepted_exposure':'https://prove2.me/theorems/0fff8924-afe0-4653-8c3c-2f4f5cd815cd',
            'open_leaf':'https://prove2.me/theorems/33fc334e-e05b-4090-ac49-f83fd94d9305',
            'mission':'https://prove2.me/missions/The%20Polynomial%20Hirsch%20Conjecture',
            'related_api':'https://prove2.me/api/v1/theorems?q=product&env=c5ea00351c28e24afc9f0f84379aa41082b1188f&limit=100'}
          report={'fetched_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'reads':[]}
          for name,url in urls.items():
            row={'name':name,'url':url}
            try:
              with urllib.request.urlopen(url,timeout=25) as response:
                row['http_status']=response.status; raw=response.read().decode()
              p=Text();p.feed(raw);text='\n'.join(p.parts)
              (out/(name+'.txt')).write_text(text)
              row['text_file']=name+'.txt'
              start=max(0,text.find('Frontier')) if name=='mission' else 0
              print(name,text[start:start+1500])
            except Exception as exc: row['error']=str(exc);print(name,repr(exc))
            report['reads'].append(row)
          (out/'live-frontier.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib cache
        run: ~/.elan/bin/lake exe cache get
      - name: Compile admission-free product and affine geometry
        run: |
          set -o pipefail
          ~/.elan/bin/lake build Solutions.PolynomialAffineProductFace Solutions.PolynomialBoundaryWalk 2>&1 | tee boundary_product_packet/core-build.log
      - name: Compile exact-type main theorem
        run: |
          set -o pipefail
          ~/.elan/bin/lake build Solutions.PolynomialBoundaryProductSubmission 2>&1 | tee boundary_product_packet/submission-build.log
      - name: Independently check exact proof bytes and axioms
        run: |
          python3 scripts/bundle_boundary_product.py
          python3 - <<'PY'
          import hashlib,json,pathlib,re,subprocess,time
          out=pathlib.Path('boundary_product_packet');report={}
          standard={'propext','Classical.choice','Quot.sound'}
          for name in ['geometry.lean','solution.lean']:
            path=out/name;start=time.monotonic()
            p=subprocess.run([str(pathlib.Path.home()/'.elan/bin/lake'),'env','lean',str(path)],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=280)
            seconds=time.monotonic()-start
            (out/(name+'.log')).write_text(p.stdout);print(p.stdout)
            if p.returncode: raise SystemExit(p.returncode)
            entries=re.findall(r"'([^']+)' depends on axioms:\s*\[([^]]*)\]",p.stdout)
            if not entries: raise RuntimeError('Missing axiom report')
            allowed=standard if name=='geometry.lean' else standard|{'sorryAx'}
            for decl,raw in entries:
              axioms={s.strip() for s in raw.split(',') if s.strip()}
              if not axioms<=allowed: raise RuntimeError((decl,axioms-allowed))
            report[name]={'compiled':True,'seconds':round(seconds,4),'lines':len(path.read_text().splitlines()),'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'axiom_reports':entries}
          report['dependency_note']='The only external theorem in solution.lean is public Proved Hirsch.larman_bound; its local stub accounts for sorryAx. No theorem stubs occur in geometry.lean.'
          (out/'verification.json').write_text(json.dumps(report,indent=2)+'\n')
          print('EXACT_PACKET_VERIFIED',json.dumps(report))
          PY
      - name: Upload checked packet and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-product-proof-packet
          path: boundary_product_packet/
          if-no-files-found: error
