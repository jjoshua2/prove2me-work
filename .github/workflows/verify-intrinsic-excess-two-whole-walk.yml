name: Verify intrinsic excess-two whole-walk routing
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
concurrency:
  group: intrinsic-excess-two-whole-walk-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/intrinsic-excess-two-whole-walk'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit intrinsic whole-walk routing
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialIntrinsicExcessTwoWholeWalkRouting 2>&1 | tee /tmp/intrinsic-excess-two-whole-walk.log
          python3 scripts/check_lean_axiom_log.py /tmp/intrinsic-excess-two-whole-walk.log \
            HirschCircuitLocalization.commonFace_has_subpresentation_dim_add_two_of_minCount_le \
            HirschCircuitLocalization.feasible_sequence_edge_route_two_mul_of_minCounts \
            HirschCircuitLocalization.rowCircuitWalk_edge_route_two_mul_of_uniform_minCount
