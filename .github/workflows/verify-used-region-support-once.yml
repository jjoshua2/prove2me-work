name: Verify used-region support routing once

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

concurrency:
  group: used-region-support-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/used-region-support-routing'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore shared pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit used-region support routing
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialUsedRegionRouting
          lake env lean Solutions/PolynomialUsedRegionRouting.lean 2>&1 | tee /tmp/used-region-support.log
          python3 scripts/check_lean_axiom_log.py /tmp/used-region-support.log \
            HirschRegionRoute.route_of_connected_regions_with_used_labels \
            HirschRegionRoute.route_of_preconnected_face_cover_with_parent_routes_used_labels
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: used-region-support-verification
          retention-days: 14
          path: /tmp/used-region-support.log
          if-no-files-found: warn
