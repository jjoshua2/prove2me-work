name: Verify active Hirsch deletion branches
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: verify-active-hirsch-deletion-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/one-row-deletion-far-cap-level'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit far-cap level
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialOneRowDeletionFarCapLevel
          lake env lean Solutions/PolynomialOneRowDeletionFarCapLevel.lean 2>&1 | tee /tmp/one-row-deletion-far-cap-level.log
          python3 scripts/check_lean_axiom_log.py /tmp/one-row-deletion-far-cap-level.log \
            HirschDeletion.exists_far_deletion_cap_level \
            HirschDeletion.deletionCappedOuter_inter_deletedRow_eq_parent \
            HirschDeletion.deletion_cap_face_disjoint_parent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-hirsch-deletion-verification
          retention-days: 14
          path: /tmp/one-row-deletion-far-cap-level.log
          if-no-files-found: warn
