name: Verify active Hirsch deletion branches
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: verify-active-hirsch-deletion-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      (github.head_ref == 'formal/direct-row-deletion-routing' ||
       github.head_ref == 'formal/one-row-deletion-cap-functional')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit active deletion theorem
        run: |
          set -euo pipefail
          case "$GITHUB_HEAD_REF" in
            formal/direct-row-deletion-routing)
              lake build Solutions.PolynomialDirectRowDeletionRouting
              lake env lean Solutions/PolynomialDirectRowDeletionRouting.lean 2>&1 | tee /tmp/direct-row-deletion-routing.log
              python3 scripts/check_lean_axiom_log.py /tmp/direct-row-deletion-routing.log \
                HirschDeletion.hpoly_eq_deleteRow_inter_row \
                HirschDeletion.hpoly_diamLE_of_bounded_deleteRow_outer
              ;;
            formal/one-row-deletion-cap-functional)
              lake build Solutions.PolynomialOneRowDeletionCapFunctional
              lake env lean Solutions/PolynomialOneRowDeletionCapFunctional.lean 2>&1 | tee /tmp/one-row-deletion-cap-functional.log
              python3 scripts/check_lean_axiom_log.py /tmp/one-row-deletion-cap-functional.log \
                HirschDeletion.deletionCapValue_pos_of_injective \
                HirschDeletion.deletionCapValue_pos_on_recession_of_bounded
              ;;
            *)
              echo "unexpected branch: $GITHUB_HEAD_REF" >&2
              exit 1
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-hirsch-deletion-verification
          retention-days: 14
          path: |
            /tmp/direct-row-deletion-routing.log
            /tmp/one-row-deletion-cap-functional.log
          if-no-files-found: warn
