name: Verify circuit deletion savings hosted
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: verify-circuit-deletion-savings-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      (github.head_ref == 'verify/circuit-deletion-savings-hosted' ||
       github.head_ref == 'formal/circuit-deletion-savings-public' ||
       github.head_ref == 'formal/saturated-carrier-blocker' ||
       github.head_ref == 'formal/circuit-step-savings-dichotomy' ||
       github.head_ref == 'formal/saturated-phase-blocker' ||
       github.head_ref == 'formal/min-presentation-phase-dichotomy' ||
       github.head_ref == 'formal/irredundant-min-carrier-dichotomy')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit exact savings module
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialCircuitDeletionSavings
          lake env lean Solutions/PolynomialCircuitDeletionSavings.lean 2>&1 | tee /tmp/circuit-deletion-savings-hosted.log
          python3 scripts/check_lean_axiom_log.py /tmp/circuit-deletion-savings-hosted.log \
            HirschCircuitLocalization.rowCircuit_selected_defect_le_discarded_neutral_of_bounded \
            HirschCircuitLocalization.rowCircuit_selected_excess_defect_savings_identity_of_bounded \
            HirschCircuitLocalization.rowCircuit_selected_excess_defect_add_nonneutral_savings_le_of_bounded \
            HirschCircuitLocalization.rowCircuit_selected_budget_saturated_iff_of_bounded
          if [[ -f Solutions/PolynomialCircuitDeletionSavingsPublic.lean ]]; then
            lake build Solutions.PolynomialCircuitDeletionSavingsPublic
            lake env lean Solutions/PolynomialCircuitDeletionSavingsPublic.lean 2>&1 | tee /tmp/circuit-deletion-savings-public.log
            python3 scripts/check_lean_axiom_log.py /tmp/circuit-deletion-savings-public.log \
              Hirsch.row_circuit_selected_excess_defect_savings_identity
          fi
          if [[ -f Solutions/PolynomialCircuitSaturatedBlocker.lean ]]; then
            lake build Solutions.PolynomialCircuitSaturatedBlocker
            lake env lean Solutions/PolynomialCircuitSaturatedBlocker.lean 2>&1 | tee /tmp/circuit-saturated-blocker.log
            python3 scripts/check_lean_axiom_log.py /tmp/circuit-saturated-blocker.log \
              HirschCircuitLocalization.rowCircuit_saturated_selected_contains_effective_nonneutral \
              HirschCircuitLocalization.rowCircuitStep_saturated_selected_target_blocker \
              HirschCircuitLocalization.rowCircuitStep_saturated_selected_targetOnlyRow
          fi
          if [[ -f Solutions/PolynomialCircuitStepSavingsDichotomy.lean ]]; then
            lake build Solutions.PolynomialCircuitStepSavingsDichotomy
            lake env lean Solutions/PolynomialCircuitStepSavingsDichotomy.lean 2>&1 | tee /tmp/circuit-step-savings-dichotomy.log
            python3 scripts/check_lean_axiom_log.py /tmp/circuit-step-savings-dichotomy.log \
              HirschCircuitLocalization.rowCircuitStep_selected_strict_budget_or_targetOnlyRow \
              HirschCircuitLocalization.rowCircuitStep_minPresentation_strict_budget_or_selected_targetOnlyRow
          fi
          if [[ -f Solutions/PolynomialCircuitSaturatedPhaseBlocker.lean ]]; then
            lake build Solutions.PolynomialCircuitSaturatedPhaseBlocker
            lake env lean Solutions/PolynomialCircuitSaturatedPhaseBlocker.lean 2>&1 | tee /tmp/circuit-saturated-phase-blocker.log
            python3 scripts/check_lean_axiom_log.py /tmp/circuit-saturated-phase-blocker.log \
              HirschCircuitLocalization.rowCircuitStep_saturated_same_phase_selected_target_positive_blocker
          fi
          if [[ -f Solutions/PolynomialCircuitMinPresentationPhaseDichotomy.lean ]]; then
            lake build Solutions.PolynomialCircuitMinPresentationPhaseDichotomy
            lake env lean Solutions/PolynomialCircuitMinPresentationPhaseDichotomy.lean 2>&1 | tee /tmp/circuit-min-presentation-phase-dichotomy.log
            python3 scripts/check_lean_axiom_log.py /tmp/circuit-min-presentation-phase-dichotomy.log \
              HirschCircuitLocalization.rowCircuitStep_minPresentation_same_phase_strict_budget_or_selected_target_positive_blocker
          fi
          if [[ -f Solutions/PolynomialCircuitIrredundantMinCarrierDichotomy.lean ]]; then
            lake build Solutions.PolynomialCircuitIrredundantMinCarrierDichotomy
            lake env lean Solutions/PolynomialCircuitIrredundantMinCarrierDichotomy.lean 2>&1 | tee /tmp/circuit-irredundant-min-carrier-dichotomy.log
            python3 scripts/check_lean_axiom_log.py /tmp/circuit-irredundant-min-carrier-dichotomy.log \
              HirschCircuitLocalization.rowCircuitStep_irredundant_minPresentation_strict_budget_or_essential_targetOnlyRow \
              HirschCircuitLocalization.rowCircuitStep_irredundant_minPresentation_same_phase_strict_budget_or_essential_trapped_blocker
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuit-deletion-savings-hosted-verification
          retention-days: 14
          path: |
            /tmp/circuit-deletion-savings-hosted.log
            /tmp/circuit-deletion-savings-public.log
            /tmp/circuit-saturated-blocker.log
            /tmp/circuit-step-savings-dichotomy.log
            /tmp/circuit-saturated-phase-blocker.log
            /tmp/circuit-min-presentation-phase-dichotomy.log
            /tmp/circuit-irredundant-min-carrier-dichotomy.log
          if-no-files-found: warn