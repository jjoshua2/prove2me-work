name: One-shot publish verified circuit neutral rank and defect

on:
  push:
    branches: [publish/circuit-neutral-rank-defect]

permissions:
  contents: read
  actions: read

concurrency:
  group: one-shot-publish-circuit-neutral-rank-defect
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-slim
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download immutable successful verification artifact
        uses: actions/download-artifact@v4
        with:
          name: circuit-neutral-rank
          path: _verified_artifact
          repository: jjoshua2/prove2me-work
          run-id: 34510652994
          github-token: ${{ github.token }}
      - name: Publish only independently compiled proofs
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/publish_verified_circuit_neutral_rank_defect.py \
            --artifact-root _verified_artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prove2me-circuit-neutral-rank-defect-publication-receipts
          retention-days: 30
          if-no-files-found: warn
          path: prove2me_circuit_neutral_rank_defect_receipts/
