name: Publish damage repair theorems
on:
  push:
    branches: [chatgpt/publish-damage-repair]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-damage-repair
  cancel-in-progress: true
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/publish-geodesic-face-cover
          path: _publisher_source
          persist-credentials: false
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y > /tmp/setup.log 2>&1
          ~/.elan/bin/lake exe cache get >> /tmp/setup.log 2>&1 || { tail -100 /tmp/setup.log; exit 1; }
      - name: Rebuild source and both standalone proofs
        run: |
          set -euo pipefail
          ~/.elan/bin/lake build Solutions.Sol_Hirsch_ordered_damage_repair Solutions.PolynomialMixedRegionRouting 2>&1 | tee /tmp/source.log
          python3 scripts/check_lean_axiom_log.py /tmp/source.log solution HirschRegionRoute.route_of_faces_and_surviving_edges
          python3 scripts/bundle_damage_progress.py
          for f in ordered_exact mixed_regions; do
            ~/.elan/bin/lake env lean "damage_progress_packet/$f.lean" 2>&1 | tee "/tmp/$f.log"
            python3 scripts/check_lean_axiom_log.py "/tmp/$f.log" solution
          done
      - name: Publish and verify serially on Prove2Me
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$PROVE2ME_API_KEY"
          python3 scripts/run_reused_publisher_damage.py ordered_exact
          python3 scripts/run_reused_publisher_damage.py mixed_regions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: damage-repair-publication-receipts
          path: |
            damage_progress_packet/
            damage_repair_publish_receipts/
