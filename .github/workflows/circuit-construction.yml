name: Circuit construction
on:
  workflow_dispatch:
concurrency:
  group: circuit-construction-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read live frontier without exposing credentials
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: |
          mkdir -p circuit_construction_packet
          python3 - <<'PY'
          import datetime,json,os,pathlib,urllib.request,urllib.parse
          from html.parser import HTMLParser
          out=pathlib.Path('circuit_construction_packet')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**kw): raise RuntimeError('Authenticated redirect refused')
          class Text(HTMLParser):
              def __init__(self): super().__init__(); self.parts=[]; self.skip=0
              def handle_starttag(self,t,a):
                  if t in ('script','style'): self.skip+=1
              def handle_endtag(self,t):
                  if t in ('script','style'): self.skip=max(0,self.skip-1)
              def handle_data(self,s):
                  if not self.skip and s.strip(): self.parts.append(s.strip())
          report={'fetched_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'submitted':False}
          key=os.environ.get('PROVE2ME_API_KEY','').strip()
          report['credential_present']=bool(key)
          if key:
              try:
                  base='https://prove2.me/api/v1'
                  opener=urllib.request.build_opener(NoRedirect)
                  req=urllib.request.Request(base+'/agent/refresh',data=json.dumps({'api_key':key}).encode(),headers={'Content-Type':'application/json'},method='POST')
                  with opener.open(req,timeout=30) as r: auth=json.load(r)
                  token=auth['access_token']
                  report['authenticated']=True
                  for label,path in [('leaf','/theorems/33fc334e-e05b-4090-ac49-f83fd94d9305'),('related','/theorems?'+urllib.parse.urlencode({'env':'c5ea00351c28e24afc9f0f84379aa41082b1188f','q':'circuit','limit':200}))]:
                      req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+token})
                      with opener.open(req,timeout=30) as r: value=json.load(r)
                      (out/(label+'.json')).write_text(json.dumps(value,indent=2))
                      if label=='leaf': report[label]={k:value.get(k) for k in ('theorem_id','theorem_name','status','mathlib_rev')}
              except Exception as e:
                  report['authenticated_error']=type(e).__name__
          else:
              report['authenticated']=False
          for name,url in [('user','https://prove2.me/users/c7399005-c54f-46c6-83fd-0131738d1e3f'),('mission','https://prove2.me/missions/The%20Polynomial%20Hirsch%20Conjecture')]:
              try:
                  with urllib.request.urlopen(url,timeout=30) as r:
                      p=Text(); p.feed(r.read().decode())
                  (out/(name+'.txt')).write_text('\n'.join(p.parts))
                  report[name]='fetched'
              except Exception as e: report[name]=type(e).__name__
          (out/'live-state.json').write_text(json.dumps(report,indent=2))
          print('LIVE_STATE',json.dumps(report))
          PY
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile exact circuit construction modules
        run: |
          set -o pipefail
          lake build Solutions.CircuitSlackBridge Solutions.CircuitProgressNumerics Solutions.CircuitConformal 2>&1 | tee circuit_construction_packet/build.log
      - name: Independently compile bundled files and audit axioms
        run: python3 scripts/check_circuit_construction.py
      - name: Upload proof bytes and verification evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-construction-proof-packet
          path: circuit_construction_packet/
          if-no-files-found: error
          retention-days: 3
