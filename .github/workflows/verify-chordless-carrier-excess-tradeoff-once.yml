name: Verify chordless carrier excess tradeoff once

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: chordless-carrier-excess-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/chordless-carrier-excess-tradeoff' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit chordless carrier tradeoff
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialChordlessCarrierExcessTradeoff
          lake env lean Solutions/PolynomialChordlessCarrierExcessTradeoff.lean 2>&1 | tee /tmp/chordless-carrier-tradeoff.log
          python3 scripts/check_lean_axiom_log.py /tmp/chordless-carrier-tradeoff.log \
            HirschCircuitLocalization.commonFace_minExcess_add_selected_sub_three_le_of_chordless_rowFaces \
            HirschCircuitLocalization.commonFace_minExcess_le_three_of_chordless_maximal_rowFace_support
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chordless-carrier-excess-tradeoff-verification
          retention-days: 14
          path: /tmp/chordless-carrier-tradeoff.log
          if-no-files-found: warn
