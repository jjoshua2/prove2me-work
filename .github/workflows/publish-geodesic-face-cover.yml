name: Publish geodesic face-cover diameter theorem
on:
  push:
    branches: [chatgpt/publish-geodesic-face-cover]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-geodesic-face-cover
  cancel-in-progress: true
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y > /tmp/setup.log 2>&1
          ~/.elan/bin/lake exe cache get >> /tmp/setup.log 2>&1 || { tail -100 /tmp/setup.log; exit 1; }
      - name: Compile reviewed wrapper
        run: |
          set -euo pipefail
          ~/.elan/bin/lake build Solutions.Sol_Hirsch_geodesic_face_cover_diameter 2>&1 | tee /tmp/source.log
          python3 scripts/check_lean_axiom_log.py /tmp/source.log solution
      - name: Bundle and compile standalone server proof
        run: |
          set -euo pipefail
          python3 scripts/bundle_public_geodesic_face_cover.py
          ~/.elan/bin/lake env lean public_geodesic_face_cover_packet/solution.lean 2>&1 | tee /tmp/standalone.log
          python3 scripts/check_lean_axiom_log.py /tmp/standalone.log solution
      - name: Publish and verify on Prove2Me
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$PROVE2ME_API_KEY"
          python3 scripts/publish_public_geodesic_face_cover.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-geodesic-face-cover-receipts
          path: |
            public_geodesic_face_cover_packet/
            public_geodesic_face_cover_receipts/
