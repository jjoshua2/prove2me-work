name: Repair network cuts and cube obstruction
on:
  push:
    branches: [chatgpt/repair-network-cut-certificates]
    paths:
      - 'Solutions/**'
      - 'Definitions/**'
      - 'scripts/test_repair_network_cuts.py'
      - '.github/workflows/repair-network-cuts.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repair-network-cut-certificates
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact finite regressions
        run: |
          set -euo pipefail
          mkdir -p repair_network_evidence
          python3 scripts/test_repair_network_cuts.py --output repair_network_evidence/regression.json
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y > /tmp/setup.log 2>&1
          ~/.elan/bin/lake exe cache get >> /tmp/setup.log 2>&1 || { tail -100 /tmp/setup.log; exit 1; }
      - name: Compile and audit proof chain
        run: |
          set -euo pipefail
          ~/.elan/bin/lake build \
            Solutions.PolynomialProjectiveDamageSurviving \
            Solutions.PolynomialCrossingCubeObstruction 2>&1 | tee repair_network_evidence/build.log
          python3 scripts/check_lean_axiom_log.py repair_network_evidence/build.log \
            HirschFaceSplice.splice_ordered_face_blocks_of_surviving_steps_exact \
            HirschFaceSplice.splice_surviving_steps_no_growth \
            HirschRegionRoute.route_of_faces_and_surviving_edges \
            HirschRegionRoute.region_cut_condition_of_walk \
            HirschRegionRoute.region_walk_iff_cut_condition \
            HirschRegionRoute.route_of_region_cut_condition \
            HirschRegionRoute.route_of_subfamily_cut_condition \
            HirschRegionRoute.route_or_separating_region_cut \
            HirschRegionRoute.route_of_extreme_face_cut_condition \
            HirschRegionRoute.potential_le_of_route \
            HirschRegionRoute.cubeAdj_symm \
            HirschRegionRoute.cubeAdj_card_step \
            HirschRegionRoute.cube_route_dimension_lower_bound \
            HirschRegionRoute.cube_low_edge \
            HirschRegionRoute.cube_high_edge \
            HirschRegionRoute.cube_repair_regions_cost_one \
            HirschRegionRoute.crossing_intervals_cover \
            HirschRegionRoute.crossing_cube_endpoint_certificate_insufficient \
            HirschRegionRoute.cube_repair_regions_disjoint \
            HirschRegionRoute.cube_crossing_has_separating_cut
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-network-cut-evidence
          path: repair_network_evidence/
