name: Publish more audited Natura helpers
on:
  push:
    branches: [chatgpt/natura-publish-more]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require and validate Prove2Me access
        run: |
          test -n "${PROVE2ME_API_KEY:-}" || { echo '::error::PROVE2ME_API_KEY unavailable'; exit 1; }
          python3 scripts/prove2me_auth.py check --no-write
      - name: Install pinned Lean and Mathlib
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ~/.elan/bin/lake exe cache get
      - name: Compile theorem statements and direct proofs
        run: |
          set -o pipefail
          mkdir -p natura_more_publish_packet
          ~/.elan/bin/lake build \
            Theorems.Thm_HirschCircuit_rowCircuitWalk_mono \
            Solutions.Sol_HirschCircuit_rowCircuitWalk_mono \
            Theorems.Thm_HirschCircuit_exists_positive_maximal_nonnegative_step \
            Solutions.Sol_HirschCircuit_exists_positive_maximal_nonnegative_step \
            2>&1 | tee natura_more_publish_packet/build.log
          if grep -A4 "'solution' depends on axioms" natura_more_publish_packet/build.log | grep -q 'sorryAx'; then
            echo '::error::A direct proof depends on sorryAx'
            exit 1
          fi
          for f in Solutions/Sol_HirschCircuit_rowCircuitWalk_mono.lean Solutions/Sol_HirschCircuit_exists_positive_maximal_nonnegative_step.lean; do
            if grep -nE '\b(sorry|admit)\b' "$f"; then
              echo "::error::Admission in $f"
              exit 1
            fi
          done
      - name: Publish and verify both audited helpers
        run: python3 scripts/publish_natura_more.py
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natura-more-helper-publication
          path: natura_more_publish_packet/
          if-no-files-found: warn
          retention-days: 30
