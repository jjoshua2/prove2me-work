name: Verify logarithmic local-rank reduction
on:
  push:
    branches: [chatgpt/target-access-equivalence]
permissions:
  contents: read
concurrency:
  group: verify-log-local-rank-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pinned environment
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit logarithmic-rank dichotomy
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialLogLocalRankReduction 2>&1 | tee /tmp/log-local-rank.log
          python3 - <<'PY'
          import re
          text=open('/tmp/log-local-rank.log',encoding='utf-8').read()
          for name in ['HirschLogRank.activeNeutral_mem','HirschLogRank.target_access_or_large_local_neutral_rank']:
              m=re.search(re.escape("'"+name+"' depends on axioms:")+r'\s*\[([^]]*)\]',text)
              if not m: raise SystemExit('missing axiom report for '+name)
              ax={x.strip() for x in m.group(1).split(',') if x.strip()}
              allowed={'propext','Classical.choice','Quot.sound'}
              if name.endswith('target_access_or_large_local_neutral_rank'):
                  allowed.add('sorryAx')
              bad=ax-allowed
              if bad: raise SystemExit('unexpected axioms for '+name+': '+repr(bad))
              print(name,sorted(ax))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-local-rank-audit
          retention-days: 3
          path: /tmp/log-local-rank.log
          if-no-files-found: warn
