name: Publish common-face structural theorems
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-common-face-tradeoff
  cancel-in-progress: true
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile public definition and reviewed wrappers
        run: |
          set -euo pipefail
          lake build Definitions.Def_Hirsch_common_face_geometry 2>&1 | tee /tmp/definition.log
          for mod in \
            Solutions.Sol_Hirsch_common_face_dimension_tradeoff \
            Solutions.Sol_Hirsch_common_face_effective_count_bound \
            Solutions.Sol_Hirsch_common_face_effective_diameter
          do
            label="${mod##*.}"
            lake build "$mod" 2>&1 | tee "/tmp/${label}.log"
            python3 scripts/check_lean_axiom_log.py "/tmp/${label}.log" solution
          done
      - name: Bundle and compile standalone server proofs
        run: |
          set -euo pipefail
          python3 scripts/bundle_public_common_face_tradeoff.py
          for label in tradeoff effective_count effective_diameter
          do
            lake env lean "public_common_face_packet/${label}_solution.lean" 2>&1 | tee "/tmp/${label}_standalone.log"
            python3 scripts/check_lean_axiom_log.py "/tmp/${label}_standalone.log" solution
          done
      - name: Publish definition and theorems to Prove2Me
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$PROVE2ME_API_KEY"
          python3 scripts/publish_public_common_face_tradeoff.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: public-common-face-publication-receipts
          path: |
            public_common_face_packet/
            public_common_face_publish_receipts/
