name: Sparse-face d-step induction
on:
  push:
    branches: [chatgpt/dstep-sparse-face-induction]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dstep-sparse-face-induction
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean and Mathlib
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y > /tmp/setup.log 2>&1
          ~/.elan/bin/lake exe cache get >> /tmp/setup.log 2>&1 || { tail -100 /tmp/setup.log; exit 1; }
      - name: Compile sparse induction and audit axioms
        run: |
          set -o pipefail
          ~/.elan/bin/lake build \
            Solutions.PolynomialFaceSparsePresentation \
            Solutions.PolynomialBalancedSparseInduction \
            2>&1 | tee /tmp/dstep-sparse.log
          ! grep -q sorryAx /tmp/dstep-sparse.log
          grep -F "'HirschPolynomialAccess.commonFace_coord_diam_of_sparse_balanced' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/dstep-sparse.log
          grep -F "'HirschPolynomialAccess.balanced_neighbor_dstep_of_sparse_target_face' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/dstep-sparse.log
          grep -F "'HirschPolynomialAccess.balanced_counterexample_neighbors_not_sparse' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/dstep-sparse.log
          grep -F "'HirschPolynomialAccess.balanced_codim_one_counterexample_neighbor_not_sparse' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/dstep-sparse.log
