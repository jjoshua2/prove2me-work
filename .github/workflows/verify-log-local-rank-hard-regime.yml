name: Verify large local-rank hard-regime reduction
on:
  push:
    branches: [chatgpt/target-access-equivalence]
permissions:
  contents: read
concurrency:
  group: verify-large-local-rank-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pinned environment
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit hard-regime reduction
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialLogLocalRankHardRegime 2>&1 | tee /tmp/log-local-rank-hard.log
          python3 - <<'PY'
          import re
          text=open('/tmp/log-local-rank-hard.log',encoding='utf-8').read()
          name='HirschLogRank.full_target_access_of_large_local_neutral_rank_regime'
          m=re.search(re.escape("'"+name+"' depends on axioms:")+r'\s*\[([^]]*)\]',text)
          if not m: raise SystemExit('missing axiom report for '+name)
          ax={x.strip() for x in m.group(1).split(',') if x.strip()}
          allowed={'propext','Classical.choice','Quot.sound','sorryAx'}
          bad=ax-allowed
          if bad: raise SystemExit('unexpected axioms: '+repr(bad))
          print(name,sorted(ax))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-local-rank-hard-audit
          retention-days: 3
          path: /tmp/log-local-rank-hard.log
          if-no-files-found: warn
