name: Verify excess-two checkpoint routing

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: excess-two-checkpoint-route-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.head_ref == 'formal/excess-two-checkpoint-route'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit route theorems
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialExcessTwoCheckpointRoute 2>&1 | tee /tmp/excess-two-checkpoint-route.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/excess-two-checkpoint-route.log').read_text(encoding='utf-8')
          names=[
            'HirschPolynomialAccess.route_of_feasible_sequence_two_per_step_of_rows_le_dim_add_two',
            'HirschPolynomialAccess.edge_route_of_rowCircuitWalk_two_per_step_of_rows_le_dim_add_two',
          ]
          allowed={'propext','Classical.choice','Quot.sound'}
          pat=re.compile(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",re.S)
          reports={n:{x.strip() for x in raw.split(',') if x.strip()} for n,raw in pat.findall(text)}
          for n in re.findall(r"'([^']+)' does not depend on any axioms",text): reports[n]=set()
          for name in names:
            if name not in reports: raise SystemExit('missing axiom report for '+name)
            bad=reports[name]-allowed
            if bad: raise SystemExit(f'unexpected axioms for {name}: {sorted(bad)}')
            print(name, sorted(reports[name]))
          print('PASS: excess-two checkpoint route audited')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: excess-two-checkpoint-route-audit
          retention-days: 3
          path: /tmp/excess-two-checkpoint-route.log
          if-no-files-found: warn
