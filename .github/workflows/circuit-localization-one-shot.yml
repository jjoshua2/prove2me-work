name: One-shot circuit localization verification
on:
  push:
    branches: [formal/circuit-localization]
permissions:
  contents: read
concurrency:
  group: circuit-localization-one-shot
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile source results and public adapters
        run: |
          set -euo pipefail
          mkdir -p /tmp/circuit-localization-packet
          lake build Solutions.PolynomialCircuitLocalization \
            Solutions.PolynomialCircuitLocalizationBalanced \
            Solutions.Sol_Hirsch_row_circuit_common_face_localization \
            Solutions.Sol_Hirsch_balanced_row_circuit_vertices_share_tight_row \
            2>&1 | tee /tmp/circuit-localization-packet/source.log
          ! grep -q sorryAx /tmp/circuit-localization-packet/source.log
          python3 scripts/check_lean_axiom_log.py /tmp/circuit-localization-packet/source.log \
            HirschCircuitLocalization.commonFaceDim_le_sourceOnlyRows_card \
            HirschCircuitLocalization.commonFaceDim_le_targetOnlyRows_card \
            HirschCircuitLocalization.circuitNeutralRows_card_ge_dim_sub_one \
            HirschCircuitLocalization.rowCircuit_commonFaceDim_localization \
            HirschCircuitLocalization.rowCircuit_commonFaceDim_twice_le_excess_add_one \
            HirschCircuitLocalization.balanced_rowCircuit_vertices_share_nonzero_tight_row \
            solution
      - name: Build and independently compile standalone Prove2Me proofs
        run: |
          set -euo pipefail
          packet=/tmp/circuit-localization-packet
          python3 scripts/build_circuit_localization_standalone.py \
            Solutions.Sol_Hirsch_row_circuit_common_face_localization \
            "$packet/localization-solution.lean" "$packet/localization-manifest.json"
          lake env lean "$packet/localization-solution.lean" \
            2>&1 | tee "$packet/localization-standalone.log"
          python3 scripts/check_lean_axiom_log.py "$packet/localization-standalone.log" solution
          python3 scripts/build_circuit_localization_standalone.py \
            Solutions.Sol_Hirsch_balanced_row_circuit_vertices_share_tight_row \
            "$packet/balanced-solution.lean" "$packet/balanced-manifest.json"
          lake env lean "$packet/balanced-solution.lean" \
            2>&1 | tee "$packet/balanced-standalone.log"
          python3 scripts/check_lean_axiom_log.py "$packet/balanced-standalone.log" solution
          printf '%s\n' "$GITHUB_SHA" > "$packet/source-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuit-localization-one-shot
          retention-days: 7
          path: /tmp/circuit-localization-packet/
