name: Verify simultaneous clip pair legs
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
permissions:
  contents: read
concurrency:
  group: verify-simultaneous-clip-pair-legs-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/simultaneous-clip-pair-legs' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit pair-specific clipping legs
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialSimultaneousClipPairLegs
          lake env lean Solutions/PolynomialSimultaneousClipPairLegs.lean 2>&1 | tee /tmp/simultaneous-clip-pair-legs.log
          python3 scripts/check_lean_axiom_log.py /tmp/simultaneous-clip-pair-legs.log \
            HirschRadial.clipRepairPairCost_sum_eq_cut_add_old_length \
            HirschRadial.route_clip_of_lifted_endpoints_with_pair_specific_cut_legs \
            HirschRadial.route_clip_with_pair_specific_cut_legs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simultaneous-clip-pair-legs-verification
          retention-days: 14
          path: /tmp/simultaneous-clip-pair-legs.log
          if-no-files-found: warn
