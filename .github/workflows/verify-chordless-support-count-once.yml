name: Verify chordless support count once

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: chordless-support-count-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/chordless-support-neighbor-count' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit chordless support count
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialChordlessSupportCount
          lake env lean Solutions/PolynomialChordlessSupportCount.lean 2>&1 | tee /tmp/chordless-support-count.log
          python3 scripts/check_lean_axiom_log.py /tmp/chordless-support-count.log \
            HirschRegionRoute.chordless_support_neighbor_eq_prev_or_next \
            HirschRegionRoute.supportNeighborFinset_card_le_two \
            HirschRegionRoute.mem_nonneighborSelectedFinset \
            HirschRegionRoute.nonneighborSelectedFinset_card_ge_sub_three
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chordless-support-count-verification
          retention-days: 14
          path: /tmp/chordless-support-count.log
          if-no-files-found: warn
