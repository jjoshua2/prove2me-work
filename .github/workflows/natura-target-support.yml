name: Natura target-support uniqueness
on:
  push:
    branches: [chatgpt/natura-target-support]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and Mathlib
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ~/.elan/bin/lake exe cache get
      - name: Build and audit target-support uniqueness
        run: |
          set -o pipefail
          ~/.elan/bin/lake build Solutions.CircuitTargetSupport 2>&1 | tee /tmp/target-support.log
          if grep -q 'sorryAx' /tmp/target-support.log; then exit 1; fi
