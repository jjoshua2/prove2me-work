name: Verify current exterior-cap routing
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: verify-current-exterior-cap-routing-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/current-exterior-cap-routing'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit current exterior-cap routing
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialCurrentExteriorCapRouting
          lake env lean Solutions/PolynomialCurrentExteriorCapRouting.lean 2>&1 | tee /tmp/current-exterior-cap-routing.log
          python3 scripts/check_lean_axiom_log.py /tmp/current-exterior-cap-routing.log \
            HirschExteriorCurrent.augmented_route_bound_of_cap_classification \
            HirschExteriorCurrent.diamLE_single_clip_of_augmented_outer_routes \
            HirschExteriorCurrent.diamLE_single_clip_of_old_routes_and_cap_classification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-exterior-cap-routing-verification
          retention-days: 14
          path: /tmp/current-exterior-cap-routing.log
          if-no-files-found: warn
