name: Publish target-tight outer once

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

concurrency:
  group: publish-target-tight-outer-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'publish/target-tight-outer'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check policy, pins, and build immutable standalone packet
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
          python3 scripts/publish_target_tight_outer.py prepare

      - name: Restore shared pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main

      - name: Compile and axiom-audit exact server proof before credential access
        run: |
          set -euo pipefail
          lake env lean /tmp/target-tight-outer-public/solution.lean 2>&1 | tee /tmp/target-tight-outer-audit.log
          python3 scripts/check_lean_axiom_log.py /tmp/target-tight-outer-audit.log \
            Hirsch.target_tight_outer_unique_vertex_zero_diameter \
            solution
          sha256sum /tmp/target-tight-outer-public/solution.lean | awk '{print $1}' \
            > /tmp/target-tight-outer-public/audit-passed.sha256

      - name: Register and verify on Prove2Me
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/publish_target_tight_outer.py publish

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-tight-outer-publication-receipts
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/target-tight-outer-public/manifest.json
            /tmp/target-tight-outer-public/audit-passed.sha256
            /tmp/target-tight-outer-audit.log
            target_tight_outer_publication_receipts/
