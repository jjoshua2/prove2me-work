name: Verify deferred padded region costs once

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

concurrency:
  group: deferred-route-costs-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/deferred-route-region-costs'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore shared pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit deferred padded region routing
        shell: bash
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialDeferredRouteRegionCosts
          lake env lean Solutions/PolynomialDeferredRouteRegionCosts.lean 2>&1 | tee /tmp/deferred-route-costs.log
          python3 scripts/check_lean_axiom_log.py /tmp/deferred-route-costs.log \
            HirschRegionRoute.route_of_connected_regions_with_shortest_deferred_route_legs \
            HirschRegionRoute.route_of_preconnected_face_cover_with_shortest_deferred_parent_legs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deferred-route-region-costs-verification
          retention-days: 14
          path: /tmp/deferred-route-costs.log
          if-no-files-found: warn
