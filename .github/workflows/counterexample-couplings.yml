name: Exact counterexample-search coupling certificates
on:
  pull_request:
    paths:
      - 'counterexample_search/**'
      - '.github/workflows/counterexample-couplings.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce exact rational coupling certificates
        run: |
          python3 --version
          python3 counterexample_search/exact_couplings.py
      - uses: actions/upload-artifact@v4
        with:
          name: exact-counterexample-couplings
          path: counterexample_search/generated
          retention-days: 30
