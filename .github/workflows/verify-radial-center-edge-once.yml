name: Verify radial center-edge no-cut-charge once
on:
  pull_request:
    types: [ready_for_review]
permissions:
  contents: read
concurrency:
  group: radial-center-edge-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/radial-center-edge-no-cut-charge'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit center-edge radial repair
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialRadialCenterEdge
          lake env lean Solutions/PolynomialRadialCenterEdge.lean 2>&1 | tee /tmp/radial-center-edge.log
          python3 scripts/check_lean_axiom_log.py /tmp/radial-center-edge.log \
            HirschRadial.retract_mem_center_segment \
            HirschRadial.retract_center_segment_mem_clip_subsegment \
            HirschRadial.retract_image_center_segment_subset_clip_subsegment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radial-center-edge-verification
          retention-days: 14
          path: /tmp/radial-center-edge.log
          if-no-files-found: warn
