name: Verify one-row deletion horizon shadow
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: verify-deletion-horizon-shadow-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/one-row-deletion-horizon-shadow'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit deletion horizon shadow
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialOneRowDeletionHorizonShadow
          lake env lean Solutions/PolynomialOneRowDeletionHorizonShadow.lean 2>&1 | tee /tmp/deletion-horizon-shadow.log
          python3 scripts/check_lean_axiom_log.py /tmp/deletion-horizon-shadow.log \
            HirschDeletion.deletionOuter_singleCut_eq_parent \
            HirschDeletion.deletion_horizon_retract_deletedRow_face \
            HirschDeletion.deletion_horizon_chord_shadow_deletedRow_face
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deletion-horizon-shadow-verification
          retention-days: 14
          path: /tmp/deletion-horizon-shadow.log
          if-no-files-found: warn
