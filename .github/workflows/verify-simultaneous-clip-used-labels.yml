name: Verify simultaneous clipping used labels

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: verify-simultaneous-clip-used-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'jjoshua2/prove2me-work' && github.head_ref == 'formal/simultaneous-clip-used-labels'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit path-sensitive clipping theorem
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialSimultaneousClipUsedLabels 2>&1 | tee /tmp/clip-used-labels.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/clip-used-labels.log').read_text()
          names=[
            'HirschRadial.clipUsedRegionCost',
            'HirschRadial.route_clip_of_lifted_endpoints_with_parent_routes_used_labels',
          ]
          allowed={'propext','Classical.choice','Quot.sound'}
          pat=re.compile(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",re.S)
          reports={n:{x.strip() for x in raw.split(',') if x.strip()} for n,raw in pat.findall(text)}
          for n in re.findall(r"'([^']+)' does not depend on any axioms",text): reports[n]=set()
          for n in names:
            if n not in reports: raise SystemExit('missing axiom report for '+n)
            bad=reports[n]-allowed
            if bad: raise SystemExit(f'unexpected axioms for {n}: {sorted(bad)}')
            print(n, sorted(reports[n]))
          print('PASS: simultaneous clipping used-label theorem audited')
          PY
