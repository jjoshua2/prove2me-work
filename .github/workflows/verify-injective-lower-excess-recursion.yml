name: Verify injective lower-excess recursion
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: verify-injective-lower-excess-recursion-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/injective-lower-excess-recursion'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit injective lower-excess recursion
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialInjectiveLowerExcessCarrierRecursion
          lake env lean Solutions/PolynomialInjectiveLowerExcessCarrierRecursion.lean 2>&1 | tee /tmp/injective-lower-excess.log
          python3 scripts/check_lean_axiom_log.py /tmp/injective-lower-excess.log \
            HirschCircuitLocalization.LowerExcessInjectiveHpolyDiameterBound \
            HirschCircuitLocalization.commonFace_diamLE_of_minPresentationExcess_lt_of_injective \
            HirschCircuitLocalization.feasible_sequence_edge_route_mul_of_carrier_minPresentationExcess_lt_of_injective
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: injective-lower-excess-recursion-verification
          retention-days: 14
          path: /tmp/injective-lower-excess.log
          if-no-files-found: warn
