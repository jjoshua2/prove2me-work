name: Interval start-containment portals
on:
  push:
    branches: [chatgpt/interval-start-portals]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: interval-start-portals
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y > /tmp/setup.log 2>&1
          ~/.elan/bin/lake exe cache get >> /tmp/setup.log 2>&1 || { tail -100 /tmp/setup.log; exit 1; }
      - name: Compile and audit
        run: |
          set -euo pipefail
          ~/.elan/bin/lake build Solutions.PolynomialIntervalStartPortals 2>&1 | tee /tmp/build.log
          python3 scripts/check_lean_axiom_log.py /tmp/build.log \
            HirschRegionRoute.interval_portal_of_start_containment \
            HirschRegionRoute.route_of_interval_cover_of_start_containment \
            HirschRegionRoute.route_of_face_interval_cover_of_start_containment \
            HirschRegionRoute.route_of_face_interval_cover_of_active_containment
