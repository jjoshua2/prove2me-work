name: Publish verified conformal decomposition
on:
  push:
    branches: [chatgpt/natura-publish-decomposition]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: natura-publish-decomposition
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean and Mathlib
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y > /tmp/setup.log 2>&1
          ~/.elan/bin/lake exe cache get >> /tmp/setup.log 2>&1 || { tail -80 /tmp/setup.log; exit 1; }
      - name: Compile, audit, publish, and verify closed decomposition
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: python3 scripts/publish_conformal_decomposition.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformal-decomposition-publication
          path: conformal_publication/
          retention-days: 30
