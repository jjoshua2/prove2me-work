name: Publish simultaneous clipping diameter theorem
on:
  push:
    branches: [chatgpt/publish-simultaneous-clipping-diameter]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-simultaneous-clipping-diameter
  cancel-in-progress: true
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/publish-geodesic-face-cover
          path: _publisher_source
          persist-credentials: false
      - name: Check pinned environment
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Rebuild and audit bounded simultaneous clipping theorem
        run: |
          set -euo pipefail
          lake build Solutions.Sol_Hirsch_simultaneous_clipping_diameter_bound 2>&1 | tee /tmp/source.log
          python3 scripts/check_lean_axiom_log.py /tmp/source.log \
            HirschRadial.simultaneous_clipping_diameter_bound solution
      - name: Flatten, independently compile, and audit standalone proof
        run: |
          set -euo pipefail
          python3 scripts/bundle_public_simultaneous_clipping.py
          lake env lean public_simultaneous_clipping_packet/solution.lean 2>&1 | tee /tmp/standalone.log
          python3 scripts/check_lean_axiom_log.py /tmp/standalone.log solution
      - name: Publish and verify on Prove2Me
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$PROVE2ME_API_KEY"
          python3 scripts/run_reused_publisher_simultaneous_clipping.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simultaneous-clipping-publication-receipts
          retention-days: 7
          path: |
            /tmp/source.log
            /tmp/standalone.log
            public_simultaneous_clipping_packet/
            simultaneous_clipping_publish_receipts/
