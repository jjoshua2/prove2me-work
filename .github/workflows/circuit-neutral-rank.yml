name: Circuit neutral-rank verification

on:
  push:
    branches: [formal/circuit-neutral-rank]

permissions:
  contents: read

concurrency:
  group: circuit-neutral-rank
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore pinned Lean environment
        uses: ./.github/actions/setup-lean
      - name: Compile neutral-rank characterization and audit axioms
        run: |
          set -euo pipefail
          lake build \
            Solutions.PolynomialCircuitNeutralRank \
            Solutions.PolynomialCircuitFaceNeutralRank \
            Solutions.PolynomialRowRankDeletion \
            Solutions.PolynomialCommonFaceEffectiveRows \
            Solutions.PolynomialCircuitSelectedRowDefect \
            Solutions.PolynomialCircuitDefectPublicBridge \
            2>&1 | tee /tmp/circuit-neutral-rank.log
          ! grep -q sorryAx /tmp/circuit-neutral-rank.log
          python3 scripts/check_lean_axiom_log.py /tmp/circuit-neutral-rank.log \
            HirschCircuitLocalization.rowCircuit_neutral_kernel_eq_span \
            HirschCircuitLocalization.rowCircuit_neutral_rank_eq_dim_sub_one \
            HirschCircuitLocalization.rowCircuit_neutral_kernel_on_subspace_eq_span \
            HirschCircuitLocalization.rowCircuit_neutral_rank_on_subspace_eq_dim_sub_one \
            HirschCircuitLocalization.rowCircuit_neutral_rank_on_commonDirection_eq_commonFaceDim_sub_one \
            HirschCircuitLocalization.restricted_rowEval_rank_le_subrank_add_deleted \
            HirschCircuitLocalization.restricted_rowEval_defect_le_deleted \
            HirschCircuitLocalization.restricted_rowEval_effective_kernel_eq \
            HirschCircuitLocalization.restricted_rowEval_effective_rank_eq \
            HirschCircuitLocalization.commonDirection_effectiveRows_card_add_dim_le_rows_add_faceDim \
            HirschCircuitLocalization.rowCircuit_effectiveNeutral_rank_on_commonDirection_eq_faceDim_sub_one \
            HirschCircuitLocalization.rowCircuit_selectedEffectiveRows_defect_budget \
            HirschCircuitLocalization.rowCircuit_selectedEffectiveRows_excess_defect \
            HirschCircuitLocalization.effectiveRowsOn_commonDirection_eq_coordinateEffectiveRows \
            HirschCircuitLocalization.effectiveRowsOn_commonDirection_eq_publicCommonFaceEffectiveRows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuit-neutral-rank
          retention-days: 7
          path: /tmp/circuit-neutral-rank.log
