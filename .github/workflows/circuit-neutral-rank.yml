name: Circuit neutral-rank verification

on:
  push:
    branches: [formal/circuit-neutral-rank]

permissions:
  contents: read

concurrency:
  group: circuit-neutral-rank
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore pinned Lean environment
        uses: ./.github/actions/setup-lean
      - name: Compile neutral-rank core and audit axioms
        run: |
          set -euo pipefail
          mkdir -p /tmp/circuit-neutral-rank
          lake build \
            Solutions.PolynomialCircuitNeutralRank \
            Solutions.PolynomialCircuitFaceNeutralRank \
            Solutions.PolynomialRowRankDeletion \
            Solutions.PolynomialCommonFaceEffectiveRows \
            Solutions.PolynomialCircuitSelectedRowDefect \
            Solutions.PolynomialCircuitDefectPublicBridge \
            Solutions.PolynomialCircuitSubpresentationDefect \
            Solutions.PolynomialCommonFaceSubpresentationRank \
            Solutions.PolynomialCircuitSubpresentationExcess \
            Solutions.PolynomialCommonFaceMinimalSubpresentation \
            2>&1 | tee /tmp/circuit-neutral-rank/core.log
          ! grep -q sorryAx /tmp/circuit-neutral-rank/core.log
          python3 scripts/check_lean_axiom_log.py /tmp/circuit-neutral-rank/core.log \
            HirschCircuitLocalization.rowCircuit_neutral_kernel_eq_span \
            HirschCircuitLocalization.rowCircuit_neutral_rank_eq_dim_sub_one \
            HirschCircuitLocalization.rowCircuit_neutral_kernel_on_subspace_eq_span \
            HirschCircuitLocalization.rowCircuit_neutral_rank_on_subspace_eq_dim_sub_one \
            HirschCircuitLocalization.rowCircuit_neutral_rank_on_commonDirection_eq_commonFaceDim_sub_one \
            HirschCircuitLocalization.restricted_rowEval_rank_le_subrank_add_deleted \
            HirschCircuitLocalization.restricted_rowEval_defect_le_deleted \
            HirschCircuitLocalization.restricted_rowEval_effective_kernel_eq \
            HirschCircuitLocalization.restricted_rowEval_effective_rank_eq \
            HirschCircuitLocalization.commonDirection_effectiveRows_card_add_dim_le_rows_add_faceDim \
            HirschCircuitLocalization.rowCircuit_effectiveNeutral_rank_on_commonDirection_eq_faceDim_sub_one \
            HirschCircuitLocalization.rowCircuit_selectedEffectiveRows_defect_budget \
            HirschCircuitLocalization.rowCircuit_selectedEffectiveRows_excess_defect \
            HirschCircuitLocalization.effectiveRowsOn_commonDirection_eq_coordinateEffectiveRows \
            HirschCircuitLocalization.effectiveRowsOn_commonDirection_eq_publicCommonFaceEffectiveRows \
            HirschCircuitLocalization.rowCircuit_commonFace_subpresentation_defect_budget \
            HirschCircuitLocalization.commonFace_coord_zero_extreme \
            HirschCircuitLocalization.commonFace_subpresentation_effectiveRows_card_ge_dim \
            HirschCircuitLocalization.rows_ge_dimension_of_vertex \
            HirschCircuitLocalization.rowCircuit_commonFace_subpresentation_excess_defect \
            HirschCircuitLocalization.commonFace_subpresentation_exists \
            HirschCircuitLocalization.commonFaceMinSubpresentation_spec \
            HirschCircuitLocalization.commonFaceMinSubpresentation_le \
            HirschCircuitLocalization.effective_subpresentation_preserves_hpoly \
            HirschCircuitLocalization.commonFace_minSubpresentation_effective_witness \
            HirschCircuitLocalization.rowCircuit_commonFace_minSubpresentation_excess_defect
      - name: Compile public adapters separately
        run: |
          set -euo pipefail
          packet=/tmp/circuit-neutral-rank
          lake build Solutions.Sol_Hirsch_row_circuit_common_face_neutral_rank \
            2>&1 | tee "$packet/neutral-adapter.log"
          ! grep -q sorryAx "$packet/neutral-adapter.log"
          python3 scripts/check_lean_axiom_log.py "$packet/neutral-adapter.log" solution

          lake build Solutions.Sol_Hirsch_row_circuit_common_face_selected_row_defect_budget \
            2>&1 | tee "$packet/defect-adapter.log"
          ! grep -q sorryAx "$packet/defect-adapter.log"
          python3 scripts/check_lean_axiom_log.py "$packet/defect-adapter.log" solution

          lake build Solutions.Sol_Hirsch_row_circuit_common_face_subpresentation_excess_defect \
            2>&1 | tee "$packet/subpresentation-adapter.log"
          ! grep -q sorryAx "$packet/subpresentation-adapter.log"
          python3 scripts/check_lean_axiom_log.py "$packet/subpresentation-adapter.log" solution
      - name: Build and independently compile standalone Prove2Me proofs
        run: |
          set -euo pipefail
          packet=/tmp/circuit-neutral-rank
          python3 scripts/build_circuit_localization_standalone.py \
            Solutions.Sol_Hirsch_row_circuit_common_face_neutral_rank \
            "$packet/neutral-solution.lean" "$packet/neutral-manifest.json"
          lake env lean "$packet/neutral-solution.lean" \
            2>&1 | tee "$packet/neutral-standalone.log"
          ! grep -q sorryAx "$packet/neutral-standalone.log"
          python3 scripts/check_lean_axiom_log.py "$packet/neutral-standalone.log" solution

          python3 scripts/build_circuit_localization_standalone.py \
            Solutions.Sol_Hirsch_row_circuit_common_face_selected_row_defect_budget \
            "$packet/defect-solution.lean" "$packet/defect-manifest.json"
          lake env lean "$packet/defect-solution.lean" \
            2>&1 | tee "$packet/defect-standalone.log"
          ! grep -q sorryAx "$packet/defect-standalone.log"
          python3 scripts/check_lean_axiom_log.py "$packet/defect-standalone.log" solution

          python3 scripts/build_circuit_localization_standalone.py \
            Solutions.Sol_Hirsch_row_circuit_common_face_subpresentation_excess_defect \
            "$packet/subpresentation-solution.lean" "$packet/subpresentation-manifest.json"
          lake env lean "$packet/subpresentation-solution.lean" \
            2>&1 | tee "$packet/subpresentation-standalone.log"
          ! grep -q sorryAx "$packet/subpresentation-standalone.log"
          python3 scripts/check_lean_axiom_log.py "$packet/subpresentation-standalone.log" solution
          printf '%s\n' "$GITHUB_SHA" > "$packet/source-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuit-neutral-rank
          retention-days: 7
          path: /tmp/circuit-neutral-rank/
