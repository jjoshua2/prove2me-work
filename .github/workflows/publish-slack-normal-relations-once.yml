name: Recover audited slack publication
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: read
  actions: read
concurrency:
  group: recover-slack-normal-relations
  cancel-in-progress: false
jobs:
  recover:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.actor == 'jjoshua2' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'integrate/slack-normal-relations'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Cheap policy and syntax checks
        run: |
          python3 scripts/check_actions_policy.py
          python3 -m py_compile scripts/recover_slack_publication.py
      - name: Restore exact audited proof and partial publication receipt
        uses: actions/download-artifact@v4
        with:
          name: slack-normal-relations-publication
          run-id: 34618047572
          github-token: ${{ github.token }}
          path: _slack_recovery
      - name: Validate existing proof hash and axiom log without compilation
        run: python3 scripts/recover_slack_publication.py check-artifact
      - name: Check original submission and recover its board linkage
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: python3 scripts/recover_slack_publication.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slack-publication-recovered
          retention-days: 14
          path: slack_publication_recovery_receipts/
