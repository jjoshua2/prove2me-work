name: Verify injective circuit defect accounting
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: verify-injective-circuit-defect-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/injective-circuit-defect'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit injective circuit defect accounting
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialCircuitInjectiveNeutralRank
          lake build Solutions.PolynomialCircuitInjectiveDeletionSavings
          lake build Solutions.PolynomialOneRowDeletionCircuitDefect
          lake env lean Solutions/PolynomialCircuitInjectiveNeutralRank.lean 2>&1 | tee /tmp/injective-neutral.log
          lake env lean Solutions/PolynomialCircuitInjectiveDeletionSavings.lean 2>&1 | tee /tmp/injective-savings.log
          lake env lean Solutions/PolynomialOneRowDeletionCircuitDefect.lean 2>&1 | tee /tmp/deletion-defect.log
          cat /tmp/injective-neutral.log /tmp/injective-savings.log /tmp/deletion-defect.log > /tmp/injective-circuit-defect.log
          python3 scripts/check_lean_axiom_log.py /tmp/injective-circuit-defect.log \
            HirschCircuitLocalization.rows_ge_dimension_of_injective \
            HirschCircuitLocalization.rowCircuit_neutral_kernel_eq_span_of_injective \
            HirschCircuitLocalization.rowCircuit_neutral_rank_eq_dim_sub_one_of_injective \
            HirschCircuitLocalization.rowCircuit_neutral_kernel_on_subspace_eq_span_of_injective \
            HirschCircuitLocalization.rowCircuit_neutral_rank_on_subspace_eq_dim_sub_one_of_injective \
            HirschCircuitLocalization.rowCircuit_neutral_rank_on_commonDirection_eq_commonFaceDim_sub_one_of_injective \
            HirschCircuitLocalization.rowCircuit_selected_defect_le_discarded_neutral_of_injective \
            HirschCircuitLocalization.rowCircuit_selected_excess_defect_savings_identity_of_injective \
            HirschCircuitLocalization.rowCircuit_selected_excess_defect_add_nonneutral_savings_le_of_injective \
            HirschCircuitLocalization.rowCircuit_selected_budget_saturated_iff_of_injective \
            HirschDeletion.rowCircuit_neutral_rank_on_deletion_commonDirection_eq_sub_one \
            HirschDeletion.rowCircuit_selected_excess_defect_savings_identity_of_one_row_deletion \
            HirschDeletion.rowCircuit_selected_excess_defect_add_nonneutral_savings_le_of_one_row_deletion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: injective-circuit-defect-verification
          retention-days: 14
          path: /tmp/injective-circuit-defect.log
          if-no-files-found: warn
