name: Verify public closed-face disjointness once

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: closed-face-disjoint-public-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'publish/closed-face-disjointness' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit standalone theorem
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialClosedExtremeFacesDisjointPublic
          lake env lean Solutions/PolynomialClosedExtremeFacesDisjointPublic.lean 2>&1 | tee /tmp/closed-face-disjoint-public.log
          python3 scripts/check_lean_axiom_log.py /tmp/closed-face-disjoint-public.log \
            Hirsch.closed_extreme_faces_disjoint_of_no_shared_parent_extreme
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closed-face-disjoint-public-verification
          retention-days: 14
          path: /tmp/closed-face-disjoint-public.log
          if-no-files-found: warn
