name: Verify cap-level-free finite-Hpoly clipping
on:
  push:
    branches: [chatgpt/hpoly-auto-cap-level]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-hpoly-auto-cap-level
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pinned environment
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit automatic cap theorem
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialHpolyPointedClipping 2>&1 | tee /tmp/auto-cap.log
          python3 scripts/check_lean_axiom_log.py /tmp/auto-cap.log \
            HirschHpolyCap.activeRows_injOn_extreme \
            HirschHpolyCap.extremePoints_hpoly_finite \
            HirschHpolyCap.exists_far_cap_level \
            HirschHpolyCap.simultaneous_clip_diameter_from_finite_hpoly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hpoly-auto-cap-level-audit
          retention-days: 3
          path: /tmp/auto-cap.log
