name: Verify target-cone batch reinsertion once
on:
  pull_request:
    types: [ready_for_review]
permissions:
  contents: read
concurrency:
  group: target-cone-batch-final-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/target-cone-batch-reinsertion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check frozen sources, pins, and exact regression
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
          printf '%s\n' \
            'f9b5840fc7de9284a0e07048ff4d63249d63cb8ccc6a08414deac05e9f7b3108  Solutions/PolynomialSimultaneousClipParentRoutes.lean' \
            '6585ca981ffa175015be4ea43770c1f95006c3d96ca8591426cb6780e0d34ec1  Solutions/PolynomialTargetConeBatchReinsertion.lean' \
            '205a9ad1ea9ddfa030f944a01593dffd2cecedf4c8bb85765ace53cdc721a1c8  scripts/check_target_cone_batch_reinsertion.py' \
            | sha256sum -c -
          python3 scripts/check_target_cone_batch_reinsertion.py | tee /tmp/target-batch-exact.json
          python3 -c 'import json; d=json.load(open("/tmp/target-batch-exact.json")); assert d["report_sha256"] == "3106dc044009131b5a0e4ee781e1cbf8288fdab4ff348fcd2d0a27cebcd89fa3"'
          git rev-parse HEAD > /tmp/target-batch-source-commit.txt
      - name: Restore shared pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile target and audit seven declarations
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialTargetConeBatchReinsertion 2>&1 | tee /tmp/target-batch-build.log
          lake env lean Solutions/PolynomialSimultaneousClipParentRoutes.lean 2>&1 | tee /tmp/target-batch-clip-axioms.log
          lake env lean Solutions/PolynomialTargetConeBatchReinsertion.lean 2>&1 | tee /tmp/target-batch-star-axioms.log
          python3 scripts/check_lean_axiom_log.py /tmp/target-batch-clip-axioms.log \
            HirschRadial.route_clip_of_lifted_endpoints_with_parent_routes \
            HirschRadial.diamLE_clip_of_strict_centre_with_parent_routes \
            HirschRadial.route_clip_from_root_with_parent_routes
          python3 scripts/check_lean_axiom_log.py /tmp/target-batch-star-axioms.log \
            HirschTargetDeletion.compact_cap_star_of_unique_vertex \
            HirschTargetDeletion.diamLE_two_of_vertex_star \
            HirschTargetDeletion.exists_compact_star_cap_of_target_tight_selection \
            HirschTargetDeletion.target_slack_batch_reinsertion_with_parent_routes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-cone-batch-reinsertion-verification
          retention-days: 14
          path: |
            /tmp/target-batch-exact.json
            /tmp/target-batch-source-commit.txt
            /tmp/target-batch-build.log
            /tmp/target-batch-clip-axioms.log
            /tmp/target-batch-star-axioms.log
          if-no-files-found: warn
