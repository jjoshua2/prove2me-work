name: Verify strict-row carrier savings once

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: strict-row-carrier-savings-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/strict-row-carrier-savings' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit strict-row carrier savings
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialCommonFaceStrictRowSavings
          lake env lean Solutions/PolynomialCommonFaceStrictRowSavings.lean 2>&1 | tee /tmp/strict-row-carrier-savings.log
          python3 scripts/check_lean_axiom_log.py /tmp/strict-row-carrier-savings.log \
            HirschCircuitLocalization.irredundant_commonFace_rows_disjoint_strict_rows \
            HirschCircuitLocalization.commonFace_minExcess_add_strictRows_le \
            HirschCircuitLocalization.commonFace_minExcess_le_of_strictRows_card
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-row-carrier-savings-verification
          retention-days: 14
          path: /tmp/strict-row-carrier-savings.log
          if-no-files-found: warn
