name: Affine diameter transport verification

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: affine-diameter-transport-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/affine-diameter-transport'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check Actions policy
        run: python3 scripts/check_actions_policy.py
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and axiom-audit affine transport
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialAffineDiameterTransport
          lake env lean Solutions/PolynomialAffineDiameterTransport.lean 2>&1 | tee /tmp/affine-diameter-transport.log
          python3 scripts/check_lean_axiom_log.py /tmp/affine-diameter-transport.log \
            Hirsch.affineEquiv_isExtreme_image \
            Hirsch.affineEquiv_image_extremePoints \
            Hirsch.affineEquiv_adj_iff \
            Hirsch.affineEquiv_diamLE_image_iff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: affine-diameter-transport-verification
          retention-days: 7
          path: /tmp/affine-diameter-transport.log
