name: Verify simultaneous clipping without publication
# Manual only: the first attempt failed before any runner/build steps.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-simultaneous-clipping
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pinned environment
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          python3 - <<'PY'
          import json
          manifest = json.load(open('lake-manifest.json'))
          package = next(p for p in manifest['packages'] if p['name'] == 'mathlib')
          assert package['rev'] == 'c5ea00351c28e24afc9f0f84379aa41082b1188f'
          PY
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile complete clipping chain and require axiom audit
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialSimultaneousClipDiameter 2>&1 | tee /tmp/clipping-build.log
          python3 - <<'PY'
          import pathlib, re, subprocess
          names = []
          for name in ('PolynomialClosedFaceTrace', 'PolynomialConvexSubsegment', 'PolynomialRadialRetraction', 'PolynomialClipEndpointLift', 'PolynomialSimultaneousClipDiameter'):
              text = pathlib.Path('Solutions', name + '.lean').read_text()
              ns = re.search(r'^namespace (\w+)', text, re.M).group(1)
              names.extend(ns + '.' + n for n in re.findall(r'^#print axioms (\w+)', text, re.M))
          assert len(names) == 34 and len(set(names)) == 34, names
          subprocess.run(['python3', 'scripts/check_lean_axiom_log.py', '/tmp/clipping-build.log', *names], check=True)
          PY
      - name: Reproduce prior exact radial regressions
        run: |
          set -euo pipefail
          python3 scripts/test_face_preserving_checkpoints.py | tee /tmp/clipping-regression.json
          diff -u research/checkpoint_regression.json /tmp/clipping-regression.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: simultaneous-clipping-verification
          retention-days: 3
          path: |
            /tmp/clipping-build.log
            /tmp/clipping-regression.json
