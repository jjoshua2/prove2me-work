name: Export pinned compiler cache once for offline local proof iteration
on:
  workflow_dispatch:
  pull_request:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: offline-lean-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'bootstrap/offline-lean-runtime-request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check public source pins and policy
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore existing pinned compiler and dependency cache
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Archive only public compiler, dependencies, and tracked source
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/offline-lean-runtime
          mkdir -p "$out"
          toolchain="$HOME/.elan/toolchains/leanprover--lean4---v4.30.0"
          test -x "$toolchain/bin/lean"
          test -f .lake/packages/mathlib/Mathlib.lean
          "$toolchain/bin/lean" --version > "$out/toolchain-version.txt"
          git rev-parse HEAD > "$out/source-commit.txt"
          # No HOME archive, credentials, environment dump, .git directories,
          # repository secrets, or proof/publication execution is included.
          tar -I 'zstd -T2 -3' -cf "$out/toolchain.tar.zst" -C "$toolchain" bin lib include share
          tar --exclude='.git' --exclude='*/.lake/build/ir' \
            -I 'zstd -T2 -3' -cf "$out/dependencies.tar.zst" .lake/packages
          git archive --format=tar HEAD | zstd -T2 -3 -o "$out/source.tar.zst"
          (cd "$out" && sha256sum *.tar.zst > SHA256SUMS)
          du -h "$out"/*.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-offline-lean-runtime
          path: /tmp/offline-lean-runtime/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
