name: Split existing public compiler cache for offline local proof iteration
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: read
  actions: read
concurrency:
  group: offline-lean-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'bootstrap/offline-lean-runtime-request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download already produced public compiler archive; no Lean build
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '10266493173'
          run-id: '34606912882'
          repository: jjoshua2/prove2me-work
          github-token: ${{ github.token }}
          path: /tmp/public-runtime
          merge-multiple: true
      - name: Verify source hashes and split below connector's 512MiB limit
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/public-runtime
          sha256sum -c SHA256SUMS
          mkdir -p /tmp/runtime-parts /tmp/runtime-metadata
          tar -cf /tmp/runtime-payload.tar .
          sha256sum /tmp/runtime-payload.tar | sed 's|/tmp/||' > /tmp/runtime-metadata/PAYLOAD.sha256
          split -b 384M -d -a 2 /tmp/runtime-payload.tar /tmp/runtime-parts/runtime.part
          cp SHA256SUMS source-commit.txt toolchain-version.txt /tmp/runtime-metadata/
          (cd /tmp/runtime-parts && sha256sum runtime.part* > /tmp/runtime-metadata/PARTS.sha256)
          test "$(find /tmp/runtime-parts -type f | wc -l)" -eq 7
          du -h /tmp/runtime-parts/*
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-runtime-part-00
          path: /tmp/runtime-parts/runtime.part00
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-runtime-part-01
          path: /tmp/runtime-parts/runtime.part01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-runtime-part-02
          path: /tmp/runtime-parts/runtime.part02
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-runtime-part-03
          path: /tmp/runtime-parts/runtime.part03
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-runtime-part-04
          path: /tmp/runtime-parts/runtime.part04
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-runtime-part-05
          path: /tmp/runtime-parts/runtime.part05
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-runtime-part-06
          path: /tmp/runtime-parts/runtime.part06
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-runtime-metadata
          path: /tmp/runtime-metadata/
          retention-days: 1
          if-no-files-found: error
