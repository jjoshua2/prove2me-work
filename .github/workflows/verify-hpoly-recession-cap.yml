name: Verify finite-Hpoly recession and far-cap geometry
on:
  push:
    branches: [chatgpt/hpoly-recession-cap]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-hpoly-recession-cap
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pinned environment
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit recession and far-cap lemmas
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialHpolyHorizonClassify 2>&1 | tee /tmp/recession-cap.log
          python3 scripts/check_lean_axiom_log.py /tmp/recession-cap.log \
            HirschHpolyCap.ray_mem_hpoly \
            HirschHpolyCap.recession_and_neg_iff_common_kernel \
            HirschHpolyCap.capNormal_nonneg_on_recession \
            HirschHpolyCap.capNormal_pos_on_nonzero_recession \
            HirschHpolyCap.no_common_kernel_iff_no_recession_line \
            HirschHpolyCap.rowMap_ker_eq_bot \
            HirschHpolyCap.rowMap_isClosedEmbedding \
            HirschHpolyCap.capped_row_bounds \
            HirschHpolyCap.cappedHpoly_isClosed \
            HirschHpolyCap.cappedHpoly_isCompact \
            HirschHpolyCap.segment_mem_cap_of_endpoints \
            HirschHpolyCap.old_vertex_survives_cap \
            HirschHpolyCap.old_edge_survives_cap \
            HirschHpolyCap.extreme_of_tight_rows_separate \
            HirschHpolyCap.horizon_active_rows_separate \
            HirschHpolyCap.horizon_old_active_kernel_spanned \
            HirschHpolyCap.horizon_old_active_plus_row_separate \
            HirschHpolyCap.exists_inward_old_active_direction \
            HirschHpolyCap.inward_direction_has_increasing_old_row \
            HirschHpolyCap.exists_increasing_inactive_row_at_new_horizon \
            HirschHpolyCap.new_horizon_first_hit_old_vertex \
            HirschHpolyCap.first_hit_segment_adjacent \
            HirschHpolyCap.hpoly_convex \
            HirschHpolyCap.new_horizon_adjacent_old_vertex \
            HirschHpolyCap.cap_vertex_old_or_horizon_adjacent
      - name: Record verified source head
        run: |
          git rev-parse HEAD
          grep -n "theorem cap_vertex_old_or_horizon_adjacent" Solutions/PolynomialHpolyHorizonClassify.lean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hpoly-recession-cap-audit
          retention-days: 3
          path: /tmp/recession-cap.log
