name: Verify finite-Hpoly recession cap algebra
on:
  push:
    branches: [chatgpt/hpoly-recession-cap]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-hpoly-recession-cap
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pinned environment
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit recession lemmas
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialHpolyRecessionCap 2>&1 | tee /tmp/recession-cap.log
          python3 scripts/check_lean_axiom_log.py /tmp/recession-cap.log \
            HirschHpolyCap.ray_mem_hpoly \
            HirschHpolyCap.recession_and_neg_iff_common_kernel \
            HirschHpolyCap.capNormal_nonneg_on_recession \
            HirschHpolyCap.capNormal_pos_on_nonzero_recession \
            HirschHpolyCap.no_common_kernel_iff_no_recession_line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hpoly-recession-cap-audit
          retention-days: 3
          path: /tmp/recession-cap.log
