name: Verify common-face presentation-excess monotonicity
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
concurrency:
  group: common-face-excess-monotonicity-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/common-face-excess-never-increases'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit excess monotonicity
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialCommonFaceExcessMonotonicity 2>&1 | tee /tmp/common-face-excess-monotonicity.log
          python3 scripts/check_lean_axiom_log.py /tmp/common-face-excess-monotonicity.log \
            HirschCircuitLocalization.commonFace_minSubpresentation_excess_le_parent_excess_of_bounded_feasible \
            HirschCircuitLocalization.commonFace_minSubpresentationCount_le_faceDim_add_parent_excess \
            HirschCircuitLocalization.commonFace_has_subpresentation_faceDim_add_parent_excess
