name: Effective common-face row model
on:
  push:
    branches: [chatgpt/face-effective-rows]
    paths:
      - 'Solutions/**'
      - 'Definitions/**'
      - 'scripts/check_lean_axiom_log.py'
      - '.github/workflows/face-effective-rows.yml'
      - 'lean-toolchain'
      - 'lakefile.*'
      - 'lake-manifest.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: face-effective-rows
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y > /tmp/setup.log 2>&1
          ~/.elan/bin/lake exe cache get >> /tmp/setup.log 2>&1 || { tail -100 /tmp/setup.log; exit 1; }
      - name: Compile effective-row model and audit complete axiom reports
        run: |
          set -euo pipefail
          ~/.elan/bin/lake build Solutions.PolynomialFaceEffectiveRows 2>&1 | tee /tmp/effective-rows.log
          python3 scripts/check_lean_axiom_log.py /tmp/effective-rows.log \
            HirschPolynomialAccess.exists_commonFace_effective_model \
            HirschPolynomialAccess.exists_balanced_commonFace_model \
            HirschPolynomialAccess.commonFace_coord_diam_of_balanced_effective
