name: Verify target-cone used-face support
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
permissions:
  contents: read
concurrency:
  group: verify-target-cone-used-face-support-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/target-cone-used-face-support' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit target-cone used-face support
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialTargetConeUsedFaceSupport
          lake env lean Solutions/PolynomialTargetConeUsedFaceSupport.lean 2>&1 | tee /tmp/target-cone-used-face-support.log
          python3 scripts/check_lean_axiom_log.py /tmp/target-cone-used-face-support.log \
            HirschTargetDeletion.target_slack_batch_reinsertion_with_used_parent_faces
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-cone-used-face-support-verification
          retention-days: 14
          path: /tmp/target-cone-used-face-support.log
          if-no-files-found: warn
