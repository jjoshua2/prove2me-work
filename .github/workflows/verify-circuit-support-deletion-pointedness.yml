name: Verify circuit-support pointed row deletion
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: verify-circuit-support-deletion-pointedness-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/circuit-support-deletion-pointedness'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit circuit-support deletion pointedness
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialCircuitSupportDeletionPointedness
          lake env lean Solutions/PolynomialCircuitSupportDeletionPointedness.lean 2>&1 | tee /tmp/circuit-support-deletion-pointedness.log
          python3 scripts/check_lean_axiom_log.py /tmp/circuit-support-deletion-pointedness.log \
            HirschCircuitLocalization.rowCircuit_neutral_insert_rowEval_injective \
            HirschCircuitLocalization.rowCircuit_selected_rowEval_injective_of_neutral_insert_subset \
            HirschCircuitLocalization.rowCircuit_rowEval_erase_injective_of_two_nonneutral \
            HirschCircuitLocalization.rowCircuitStep_from_vertex_exists_signed_blockers \
            HirschDeletion.rowMap_rowsWithout_injective_of_two_nonneutral_rowCircuit \
            HirschDeletion.rowCircuitStep_from_vertex_exists_two_pointed_row_deletions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuit-support-deletion-pointedness-verification
          retention-days: 14
          path: /tmp/circuit-support-deletion-pointedness.log
          if-no-files-found: warn
