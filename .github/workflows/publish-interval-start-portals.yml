name: Publish interval start-containment theorem
on:
  push:
    branches: [chatgpt/publish-interval-start-portals]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-interval-start-portals
  cancel-in-progress: true
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/publish-geodesic-face-cover
          path: _publisher_source
          persist-credentials: false
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y > /tmp/setup.log 2>&1
          ~/.elan/bin/lake exe cache get >> /tmp/setup.log 2>&1 || { tail -100 /tmp/setup.log; exit 1; }
      - name: Rebuild public wrapper and standalone proof
        run: |
          set -euo pipefail
          ~/.elan/bin/lake build Solutions.Sol_Hirsch_face_interval_start_containment_route_bound 2>&1 | tee /tmp/source.log
          python3 scripts/check_lean_axiom_log.py /tmp/source.log solution HirschRegionRoute.interval_portal_of_start_containment HirschRegionRoute.route_of_face_interval_cover_of_start_containment
          python3 scripts/bundle_public_interval_start_portals.py
          ~/.elan/bin/lake env lean public_interval_start_portal_packet/solution.lean 2>&1 | tee /tmp/standalone.log
          python3 scripts/check_lean_axiom_log.py /tmp/standalone.log solution
      - name: Publish and verify on Prove2Me
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$PROVE2ME_API_KEY"
          python3 scripts/run_reused_publisher_interval_start_portals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interval-start-containment-publication-receipts
          path: |
            public_interval_start_portal_packet/
            interval_start_portal_publish_receipts/
