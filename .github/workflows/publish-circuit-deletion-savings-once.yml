name: Publish exact circuit-carrier savings identity
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: publish-circuit-deletion-savings-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true
jobs:
  publish:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.actor == 'jjoshua2' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'publish/circuit-deletion-savings-public'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare frozen publication packet
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          python3 -m py_compile scripts/publish_circuit_deletion_savings_public.py
          python3 scripts/publish_circuit_deletion_savings_public.py prepare
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
          grep -Eq '^theorem solution$' /tmp/circuit-deletion-savings-public/solution.lean
      - name: Restore shared pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Build platform definition imports
        run: |
          set -euo pipefail
          lake build Definitions.Def_Hirsch_model \
            Definitions.Def_Hirsch_circuit_model \
            Definitions.Def_Hirsch_circuit_slack_model \
            Definitions.Def_Hirsch_common_face_geometry
      - name: Compile and audit exact standalone solution
        run: |
          set -euo pipefail
          lake env lean /tmp/circuit-deletion-savings-public/solution.lean 2>&1 | tee /tmp/circuit-deletion-savings-public/solution-axioms.log
          python3 scripts/check_lean_axiom_log.py /tmp/circuit-deletion-savings-public/solution-axioms.log solution
          sha256sum /tmp/circuit-deletion-savings-public/solution.lean | awk '{print $1}' > /tmp/circuit-deletion-savings-public/solution-audit-passed.sha256
      - name: Authenticated Prove2Me preflight
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: python3 scripts/prove2me_auth.py check
      - name: Publish tracked exact identity
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: python3 scripts/publish_circuit_deletion_savings_public.py publish
      - name: Preserve sanitized publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-deletion-savings-publication
          retention-days: 14
          path: |
            /tmp/circuit-deletion-savings-public/
            circuit_deletion_savings_publication_receipts/
          if-no-files-found: warn
