name: Verify concrete H-polyhedron far-cap transfer
on:
  push:
    branches: [chatgpt/hpoly-pointed-transfer]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-hpoly-pointed-transfer
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pinned environment
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit concrete transfer
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialHpolyExteriorCapTransfer 2>&1 | tee /tmp/hpoly-transfer.log
          python3 scripts/check_lean_axiom_log.py /tmp/hpoly-transfer.log \
            HirschHpolyCap.horizonCap_convex \
            HirschHpolyCap.finalClip_capped_eq \
            HirschHpolyCap.old_diameter_routes_survive_cap \
            HirschHpolyCap.simultaneous_clip_diameter_from_finite_hpoly_far_cap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hpoly-pointed-transfer-audit
          retention-days: 3
          path: /tmp/hpoly-transfer.log
