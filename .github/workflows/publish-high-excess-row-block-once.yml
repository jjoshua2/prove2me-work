name: Publish high-excess row-block routing theorem
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: publish-high-excess-row-block-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  publish:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.actor == 'jjoshua2' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'publish/high-excess-row-block-routing'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare immutable publication packet
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          python3 -m py_compile scripts/publish_high_excess_row_block_routing.py scripts/publish_high_excess_row_block_routing_v2.py
          python3 scripts/publish_high_excess_row_block_routing_v2.py prepare
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
          grep -Fq 'theorem checked_row_block_adapter' /tmp/high-excess-row-block-public/driver.lean
          grep -Eq '^theorem solution$' /tmp/high-excess-row-block-public/solution.lean
      - name: Restore shared pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and axiom-audit dependency-free driver
        run: |
          set -euo pipefail
          lake build Definitions.Def_Hirsch_model
          lake env lean /tmp/high-excess-row-block-public/driver.lean 2>&1 | tee /tmp/high-excess-row-block-public/driver-axioms.log
          python3 scripts/check_lean_axiom_log.py /tmp/high-excess-row-block-public/driver-axioms.log \
            Hirsch.checked_row_block_adapter
          sha256sum /tmp/high-excess-row-block-public/driver.lean | awk '{print $1}' > /tmp/high-excess-row-block-public/driver-audit-passed.sha256
      - name: Authenticated Prove2Me preflight
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: python3 scripts/prove2me_auth.py check
      - name: Publish exact theorem with checked dependency
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: python3 scripts/publish_high_excess_row_block_routing_v2.py publish
      - name: Preserve proof and sanitized receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-excess-row-block-publication
          retention-days: 14
          path: |
            /tmp/high-excess-row-block-public/
            high_excess_row_block_publication_receipts/
          if-no-files-found: warn
