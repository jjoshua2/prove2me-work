name: Prescribed face proofs

on:
  push:
    branches: [chatgpt/prescribed-face-rank]

concurrency:
  group: prescribed-face-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read public Prove2Me state
        run: |
          python3 - <<'PY'
          import datetime, json, pathlib, urllib.request
          from html.parser import HTMLParser
          out=pathlib.Path('prescribed_packet'); out.mkdir(exist_ok=True)
          class Text(HTMLParser):
            def __init__(self): super().__init__(); self.parts=[]; self.skip=0
            def handle_starttag(self,t,a):
              if t in ('script','style'): self.skip+=1
            def handle_endtag(self,t):
              if t in ('script','style'): self.skip=max(0,self.skip-1)
            def handle_data(self,s):
              if not self.skip and s.strip(): self.parts.append(s.strip())
          urls={
            'accepted_local_rank':'https://prove2.me/theorems/4da3a606-c8d4-4570-a246-afbff569cc7a',
            'open_leaf':'https://prove2.me/theorems/33fc334e-e05b-4090-ac49-f83fd94d9305',
            'mission':'https://prove2.me/missions/The%20Polynomial%20Hirsch%20Conjecture',
            'related_api':'https://prove2.me/api/v1/theorems?q=exposing&env=c5ea00351c28e24afc9f0f84379aa41082b1188f&limit=50'}
          report={'fetched_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'reads':[]}
          for name,url in urls.items():
            row={'name':name,'url':url}
            try:
              with urllib.request.urlopen(url,timeout=25) as response:
                row['http_status']=response.status; raw=response.read().decode('utf-8')
              p=Text(); p.feed(raw); text='\n'.join(p.parts)
              (out/(name+'.txt')).write_text(text)
              row['text_file']=name+'.txt'
              start=text.find('Frontier') if name=='mission' else 0
              print(name,text[max(0,start):max(0,start)+2500])
            except Exception as exc: row['error']=str(exc); print(name,repr(exc))
            report['reads'].append(row)
          (out/'live-frontier.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib cache
        run: ~/.elan/bin/lake exe cache get
      - name: Compile admission-free geometric cores
        run: |
          set -o pipefail
          ~/.elan/bin/lake build Solutions.PolynomialPrescribedFaceCore Solutions.PolynomialVertexExposingRow 2>&1 | tee prescribed_packet/core-build.log
      - name: Compile exact-type submission modules
        run: |
          set -o pipefail
          ~/.elan/bin/lake build Solutions.PolynomialPrescribedFaceSubmission Solutions.PolynomialVertexExposureSubmission 2>&1 | tee prescribed_packet/submission-build.log
      - name: Bundle and audit the exact proof files
        run: |
          python3 scripts/bundle_prescribed_face.py
          python3 - <<'PY'
          import hashlib,json,pathlib,re,subprocess,time
          root=pathlib.Path('prescribed_packet')
          allowed={'propext','Classical.choice','Quot.sound'}
          for key in ('access','exposure'):
            out=root/key; proof=out/'solution.lean'
            start=time.monotonic()
            run=subprocess.run([str(pathlib.Path.home()/'.elan/bin/lake'),'env','lean',str(proof)],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=290)
            elapsed=time.monotonic()-start
            (out/'solution.audit.log').write_text(run.stdout); print(run.stdout)
            if run.returncode: raise SystemExit(run.returncode)
            found=re.search(r"'solution' depends on axioms:\s*\[([^]]*)\]",run.stdout)
            if not found: raise RuntimeError('Missing axiom report for '+key)
            axioms={x.strip() for x in found.group(1).split(',') if x.strip()}
            expected=allowed|({'sorryAx'} if key=='access' else set())
            if not axioms<=expected: raise RuntimeError('Unexpected axioms: '+repr(axioms-expected))
            report={'compiled':True,'elapsed_seconds':elapsed,'axioms':sorted(axioms),
              'mathlib_rev':'c5ea00351c28e24afc9f0f84379aa41082b1188f',
              'sha256':hashlib.sha256(proof.read_bytes()).hexdigest(),
              'bytes':proof.stat().st_size,'lines':len(proof.read_text().splitlines()),
              'platform_submitted':False,
              'local_stub_note':'Only the public Proved Larman import is a stub.' if key=='access' else 'No theorem stubs.'}
            (out/'verification.json').write_text(json.dumps(report,indent=2)+'\n')
            print('EXACT_PACKET_VERIFIED',key,json.dumps(report))
          PY
      - name: Upload exact packets and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prescribed-face-proof-packets
          path: prescribed_packet/
          if-no-files-found: error
