name: One-shot publish verified bounded simultaneous clipping

on:
  push:
    branches: [publish/bounded-simultaneous-clipping]

permissions:
  contents: read
  actions: read

concurrency:
  group: one-shot-publish-bounded-simultaneous-clipping
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-slim
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download immutable successful verification artifact
        uses: actions/download-artifact@v4
        with:
          name: simultaneous-clipping-audit
          path: _verified_artifact
          repository: jjoshua2/prove2me-work
          run-id: 34485975796
          github-token: ${{ github.token }}
      - name: Publish only the verified standalone proof
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: |
          set -eu
          python3 scripts/publish_verified_bounded_clipping.py --artifact-root _verified_artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prove2me-bounded-clipping-publication-receipts
          retention-days: 30
          if-no-files-found: warn
          path: prove2me_bounded_clipping_receipts/
