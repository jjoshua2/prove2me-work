name: Verify recursive-or-rigid carrier
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: verify-recursive-or-rigid-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'jjoshua2/prove2me-work' &&
      github.event.pull_request.head.repo.full_name == 'jjoshua2/prove2me-work' &&
      github.head_ref == 'formal/recursive-or-rigid-carrier'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check policy and pins
        run: |
          set -euo pipefail
          python3 scripts/check_actions_policy.py
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0'
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean environment
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit recursive-or-rigid carrier theorem
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialCircuitRecursiveOrRigidCarrier
          lake env lean Solutions/PolynomialCircuitRecursiveOrRigidCarrier.lean 2>&1 | tee /tmp/recursive-or-rigid-carrier.log
          python3 scripts/check_lean_axiom_log.py /tmp/recursive-or-rigid-carrier.log \
            HirschCircuitLocalization.rowCircuitStep_minPresentationExcess_le_ambient \
            HirschCircuitLocalization.rowCircuitStep_same_phase_recursive_or_equalExcess_essential_trapped_blocker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recursive-or-rigid-carrier-verification
          retention-days: 14
          path: /tmp/recursive-or-rigid-carrier.log
          if-no-files-found: warn
