name: Natura progress verification
on:
  push:
    branches: [chatgpt/natura-progress]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Prove2Me access without persisting credentials
        continue-on-error: true
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
        run: |
          mkdir -p natura_packet
          set -o pipefail
          python3 scripts/prove2me_auth.py check --no-write 2>&1 | tee natura_packet/auth.log
          python3 scripts/circuit_leaf_api.py | tee natura_packet/frontier.log
      - name: Install pinned Lean and Mathlib
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ~/.elan/bin/lake exe cache get
      - name: Compile and audit all translation and augmentation modules
        run: |
          set -o pipefail
          ~/.elan/bin/lake build Solutions.CircuitSourceBridge Solutions.CircuitAugmentation 2>&1 | tee natura_packet/build.log
          if grep -q 'sorryAx' natura_packet/build.log; then exit 1; fi
          sha256sum Solutions/Circuit*.lean > natura_packet/source-sha256.txt
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natura-progress-evidence
          path: |
            natura_packet/
            circuit_leaf_packet/api-state.json
            circuit_leaf_packet/live-leaf.json
            circuit_leaf_packet/related-theorems.json
          retention-days: 7
      - name: Package minimal credential-free runtime with streaming compression
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          mkdir -p /tmp/natura_runtime
          tar --exclude='.git' --exclude='*.a' --exclude='*.c' --exclude='*.o' --exclude='*.ilean' -cf - .lake/packages .lake/build/lib/lean Definitions/Def_Hirsch_model.lean Definitions/Def_Hirsch_circuit_model.lean Solutions/Circuit*.lean lakefile.lean lake-manifest.json lean-toolchain | zstd -T2 -3 > /tmp/natura_runtime/project.tar.zst
          tar --exclude='*.a' --exclude='*.c' --exclude='*.o' -C "$HOME/.elan/toolchains/leanprover--lean4---v4.30.0" -cf - bin lib share include | zstd -T2 -3 > /tmp/natura_runtime/toolchain.tar.zst
      - name: Transfer pinned runtime
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: natura-pinned-runtime
          path: /tmp/natura_runtime/*.zst
          compression-level: 0
          retention-days: 1
