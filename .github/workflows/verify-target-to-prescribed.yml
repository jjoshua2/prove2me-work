name: Verify target-to-prescribed reduction
on:
  push:
    branches: [chatgpt/target-to-prescribed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-target-to-prescribed
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pinned environment
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.30.0"
          grep -Fq c5ea00351c28e24afc9f0f84379aa41082b1188f lake-manifest.json
      - name: Restore pinned Lean and Mathlib
        uses: jjoshua2/prove2me-work/.github/actions/setup-lean@main
      - name: Compile and audit target-to-prescribed reduction
        run: |
          set -euo pipefail
          lake build Solutions.PolynomialTargetToPrescribed 2>&1 | tee /tmp/target-to-prescribed.log
          python3 scripts/check_lean_axiom_log.py /tmp/target-to-prescribed.log \
            HirschPolynomialAccess.commonFaceA_eq_zero_of_tight_both \
            HirschPolynomialAccess.commonFace_coord_row_eq_of_point_eq \
            HirschPolynomialAccess.commonFace_parent_row_eq_of_coord \
            HirschPolynomialAccess.commonFace_coord_endpoints_separated \
            Hirsch.prescribed_face_access_of_target_face_access_verified \
            Hirsch.polynomial_prescribed_face_access_of_target_face_access
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-to-prescribed-audit
          retention-days: 3
          path: /tmp/target-to-prescribed.log
